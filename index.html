input.tg{appearance:none;-webkit-appearance:none;width:46px;height:26px;padding:0;margin:0;border-radius:99px;background:var(--bd);position:relative;transition:.18s;border:0;flex:none;cursor:pointer}

.pick{width:100%;justify-content:space-between;margin-bottom:6px}
.hint{text-align:center;color:var(--mut);font-size:13px;padding:18px 0}
.btn.big{width:100%;padding:16px;font-size:17px;margin-top:10px}
.alert{background:rgba(220,38,38,.12);color:var(--err);border:1px solid var(--err);border-radius:12px;padding:10px;font-weight:600;font-size:14px;margin-top:6px}
.alert.bb{margin:0 0 6px;direction:ltr;text-align:left;font-weight:500;font-size:12px;word-break:break-word;white-space:pre-wrap}.alert.bb small{display:block;font-weight:700;margin-bottom:4px}
.sk.sm{height:46px}

.b.new.off{background:#9ca3af}
.rates.two{grid-template-columns:1fr 1fr}
.cd{display:inline-flex;align-items:center;padding:1px 8px;border-radius:99px;background:var(--bd);color:var(--mut);font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;unicode-bidi:isolate}
.cdbox{margin:22px 0 8px}.cdbig{font-size:26px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.done h1 svg{width:1.1em;height:1.1em;vertical-align:-.15em}
.stage.wait .flip{animation:pulse .9s infinite alternate}@keyframes pulse{from{opacity:.5}to{opacity:.15}}
.btn.dead{filter:grayscale(100%);opacity:.35;background:var(--bd);cursor:not-allowed}

<script>
// ===== إعدادات (عدّلها) =====
const SUPABASE_URL = 'https://prdlwxmslcbloinpzpnp.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InByZGx3eG1zbGNibG9pbnB6cG5wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzMDExMDYsImV4cCI6MjEwODg3NzEwNn0.ZqKqWQ09ms3r0IBj_8-VL4j5DsmHcV_juljuHaxZJu0';
const APP_LINK = 'http://t.me/Pseudoscien_Bot/PseudoCard';
const BOT_LINK = 'https://t.me/Pseudoscien_Bot';

const FRESH_MS = 600000, BATCH = 30, FLUSH_AT = 50, FLUSH_EVERY = 300000, UPC_MAX = 20, CARDS_CACHE_MAX = 1.5 * 1024 * 1024;
const LIMIT_MSG = 'لقد وصلت للحد الأقصى اليوم. راجع المستحق أو عد غداً';
const COLORS = { blue:'#2f6fe4', green:'#16a34a', violet:'#8b5cf6', amber:'#f59e0b', red:'#dc2626' };
const ICONS = ['folder', 'heart-pulse', 'brain', 'bone', 'baby', 'pill', 'stethoscope', 'microscope', 'syringe', 'flask-conical', 'book-open', 'activity'];
const DEFAULT_SETTINGS = { max_interval:365, new_per_day:20, step_again:1, step_hard:10, step_good:1440, step_easy:5760 };
const DEFAULT_PROMPT = 'أنت مساعد لإنشاء بطاقات مراجعة لطلاب الطب. اكتب البطاقات فقط داخل كتلة كود واحدة، بدون مقدمة أو شرح أو ترقيم. كل بطاقة في سطر واحد بهذه الصيغة بالضبط: الوجه :: الظهر. كل بطاقة تختبر فكرة واحدة قصيرة ودقيقة، ولا تضف معلومة غير موجودة في المصدر. اللغة: نفس لغة المصدر مع إبقاء المصطلحات الطبية بالإنجليزية.';
const LOGO_SVG = '<svg viewBox="0 0 40 40" width="34" height="34"><rect x="4" y="9" width="17" height="24" rx="4" fill="#122044" stroke="#d4a24c" transform="rotate(-18 12 21)"/><rect x="9" y="7" width="17" height="24" rx="4" fill="#0f1b3a" stroke="#d4a24c" transform="rotate(-8 17 19)"/><rect x="14" y="6" width="19" height="27" rx="4" fill="#f6efdc" stroke="#d4a24c"/><path d="M23.5 12c3 3 5 5 5 7.5a2.6 2.6 0 0 1-4.3 2l.6 3.5h-2.6l.6-3.5a2.6 2.6 0 0 1-4.3-2c0-2.5 2-4.5 5-7.5z" fill="#0b1730"/></svg>';

// ===== الحالة المركزية =====
const S = { session:null, decks:[], folders:[], counts:{}, settings:null, cwd:null, queue:[], pending:{}, view:'home', study:null, newToday:{ day:'', n:0 } };
const tg = window.Telegram.WebApp;
const authClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY,
  { auth:{ persistSession:false, autoRefreshToken:false, detectSessionInUrl:false } });
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY,
  { accessToken: async () => S.session && S.session.access_token });

// ===== أدوات =====
const $ = s => document.querySelector(s);
const val = s => { const el = $(s); return el && typeof el.value === 'string' ? el.value : ''; };
const setText = (s, t) => { const el = $(s); if (el) el.textContent = t; };
function icons(){ try { lucide.createIcons(); } catch (e) { console.error('[PseudoCard] icons:', e); } }
const ic = n => `<i data-lucide="${n}"></i>`;
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clip = (t, n) => String(t == null ? '' : t).trim().slice(0, n);
const wait = ms => new Promise(r => setTimeout(r, ms));
const uuid = () => crypto.randomUUID();
const store = {
  get(k, d = null){ try { const v = localStorage.getItem('pc:' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){
    const j = JSON.stringify(v);
    try { localStorage.setItem('pc:' + k, j); return true; }
    catch { dropCardCaches(); try { localStorage.setItem('pc:' + k, j); return true; } catch { return false; } }
  },
  del(k){ try { localStorage.removeItem('pc:' + k); } catch {} }
};
// كاش البطاقات: localStorage إن كان الحجم <= 1.5MB وإلا الذاكرة فقط (حد المتصفح 5MB)
const memCards = new Map();
function dropCardCaches(){ Object.keys(localStorage).filter(k => k.startsWith('pc:cards:')).forEach(k => localStorage.removeItem(k)); }
function cacheCards(id, rows){
  memCards.set(id, rows);
  if (JSON.stringify(rows).length * 2 > CARDS_CACHE_MAX) store.del('cards:' + id); else store.set('cards:' + id, rows);
}
function dropCards(id){ memCards.delete(id); store.del('cards:' + id); }
const localDay = () => new Date().toLocaleDateString('en-CA');
function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), Math.max(2600, msg.length * 70));
}
function haptic(kind){
  try { kind === 'flip' ? tg.HapticFeedback.impactOccurred('light') : tg.HapticFeedback.notificationOccurred(kind); } catch {}
}
// ===== الصندوق الأسود: الخطأ الحقيقي يُحفظ على الجهاز ويظهر للمشرف فقط =====
const NET_RE = /Failed to fetch|Failed to send a request|NetworkError|network|timeout|AuthRetryableFetch|Load failed/i;
function errRaw(e){
  if (e == null) return '';
  if (typeof e === 'string') return e.slice(0, 700);
  const parts = [e.message, e.code, e.status, e.details, e.hint].filter(x => x != null && x !== '');
  if (parts.length) return parts.join(' | ').slice(0, 700);
  try { return JSON.stringify(e).slice(0, 700); } catch { return String(e).slice(0, 700); }
}
function blackBox(e, ctx){
  try {
    const where = ctx || (e && e.pcCtx) || '', m = (where ? '[' + where + '] ' : '') + errRaw(e);
    store.set('last_error', { msg: m, time: new Date().toISOString() });
  } catch {}
}
function friendlyErr(e){
  const m = errRaw(e);
  if (/rate limited|over_request_rate|429/i.test(m)) return 'طلبات كثيرة، انتظر دقيقة ثم أعد المحاولة';
  if (NET_RE.test(m)) return 'لا يوجد اتصال بالإنترنت';
  if (/too large|invalid size|413|payload/i.test(m)) return 'الحجم كبير (الحد: 1000 بطاقة للمجموعة، 200 مجموعة للمجلد، 5MB)';
  if (/row-level security|42501|not admin|JWT|permission|\b40[13]\b/i.test(m)) return 'لا تملك صلاحية لهذا الإجراء';
  if (/check constraint|23514|bad name|bad cards|bad data/i.test(m)) return 'بيانات غير صالحة (تحقق من الأطوال)';
  if (/23503|foreign key|not found/i.test(m)) return 'العنصر غير موجود، ربما حُذف';
  if (/auth required|invalid signature/i.test(m)) return 'تعذّر التحقق من حسابك، أعد فتح التطبيق من تيليجرام';
  return 'حدث خطأ غير متوقع، حاول مجدداً';
}
// يسجّل الخطأ الحقيقي (للمشرف) ثم يُرجع رسالة لطيفة بلا أي كود برمجي للمستخدم
function errText(e, ctx){
  console.error('[PseudoCard]', ctx || (e && e.pcCtx) || '', e);
  blackBox(e, ctx);
  return friendlyErr(e);
}
async function copyText(text){
  try { await navigator.clipboard.writeText(text); }
  catch { const a = document.createElement('textarea'); a.value = text; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); }
  toast('تم النسخ');
}
function paint(html){ const app = $('#app'); if (!app) return; app.innerHTML = html; icons(); window.scrollTo(0, 0); }

// ===== الجلسة (Telegram Auth عبر Edge Function) =====
function saveSession(x){
  const old = store.get('session');
  if (old && old.user_id !== x.user.id) Object.keys(localStorage).filter(k => k.startsWith('pc:') && k !== 'pc:theme').forEach(k => localStorage.removeItem(k));
  S.session = { access_token:x.access_token, refresh_token:x.refresh_token, expires_at:x.expires_at, user_id:x.user.id };
  store.set('session', S.session);
}
function isDefinitiveAuthError(e){
  const status = e && e.status;
  return !!status && status >= 400 && status < 500 && status !== 429 && status !== 408;
}
async function refreshWithRetry(refreshToken){
  for (let i = 0; i < 3; i++) {
    const r = await authClient.auth.refreshSession({ refresh_token:refreshToken });
    if (!r.error && r.data.session) return r.data.session;
    if (isDefinitiveAuthError(r.error)) return null;
    await wait(700 * (i + 1));
  }
  throw new Error('Failed to fetch');
}
// دخول عبر Edge Function: توقيع تيليجرام مرفوض (4xx) = نهائي، وغير ذلك يُعاد 3 مرات
async function telegramLogin(){
  for (let i = 0; i < 3; i++) {
    const r = await authClient.functions.invoke('telegram-auth', { body:{ initData:tg.initData }, headers:{ Authorization:'Bearer ' + SUPABASE_ANON_KEY } });
    const s = r.data && r.data.session;
    if (!r.error && s && s.access_token) return s;
    const st = r.error && r.error.context && r.error.context.status;
    if (st && st >= 400 && st < 500 && st !== 429 && st !== 408) throw new Error('auth required');
    await wait(700 * (i + 1));
  }
  throw new Error('Failed to fetch');
}
async function doEnsureSession(){
  const s = S.session || store.get('session');
  if (s && s.expires_at > Date.now() / 1000 + 300) { S.session = s; return; }
  if (s) { const fresh = await refreshWithRetry(s.refresh_token); if (fresh) return saveSession(fresh); }
  saveSession(await telegramLogin());
}
let sessionLock = null;
function ensureSession(){
  if (!sessionLock) sessionLock = doEnsureSession().finally(() => { sessionLock = null; });
  return sessionLock;
}
async function call(fn, retries = 0){
  for (let i = 0; i <= retries; i++) {
    try { await ensureSession(); const r = await fn(); if (r.error) throw r.error; return r.data; }
    catch (e) { if (i === retries) throw e; await wait(800); }
  }
}

// ===== مودال وزر الرجوع =====
let modals = 0;
function syncBack(){ try { (modals > 0 || S.view !== 'home' || S.cwd) ? tg.BackButton.show() : tg.BackButton.hide(); } catch {} }
function closeAllModals(){ document.querySelectorAll('.modal').forEach(m => m.remove()); modals = 0; }
function setView(v){
  if (v !== S.view) closeAllModals();           // لا تبقى نافذة مفتوحة عند تغيير الشاشة
  if (v !== 'study') clearLoadTimer();          // مؤقّت انتظار الدفعة التالية
  if (v !== 'deck') clearTimeout(searchTimer);  // مؤقّت البحث
  S.view = v; syncBack();
}
function openModal(html){
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="sheet">${html}</div>`;
  m.addEventListener('click', e => { if (e.target === m) closeModal(); });
  document.body.appendChild(m); modals++; icons(); syncBack();
}
function closeModal(){
  const all = document.querySelectorAll('.modal');
  if (all.length) { all[all.length - 1].remove(); modals--; syncBack(); }
}
function handleBack(){
  if (modals > 0) closeModal();
  else if (S.view === 'study') exitStudy();
  else if (S.view === 'home' && S.cwd) changeFolder((S.folders.find(f => f.id === S.cwd) || {}).parent_id || null);
  else showHome();
}

// ===== الكاش والعدادات =====
let homeT = 0;
function saveHome(t = Date.now()){ homeT = t; store.set('home', { t, decks:S.decks, folders:S.folders, counts:S.counts, settings:S.settings, nt:S.newToday }); }
function loadCached(c){ homeT = c.t || 0; S.decks = c.decks || []; S.folders = c.folders || []; S.counts = c.counts || {}; S.settings = c.settings || null; S.newToday = c.nt || { day:'', n:0 }; settleAll(); }
function saveHomeKeep(){ saveHome(homeT || ((store.get('home') || {}).t) || Date.now()); }
// حفظ مؤجّل (يجمع عدة تعديلات متتالية في كتابة واحدة على localStorage)
let homeSaveTimer = null;
function saveHomeSoon(){ if (homeSaveTimer) return; homeSaveTimer = setTimeout(() => { homeSaveTimer = null; saveHomeKeep(); }, 1500); }
function saveHomeNow(){ if (homeSaveTimer) { clearTimeout(homeSaveTimer); homeSaveTimer = null; saveHomeKeep(); } }
// due = ready = غير جديدة وموعدها فعلاً <= الآن. بطاقات learning/relearning المستقبلية لا تُحسب (تظهر كعدّ تنازلي فقط)
const isReadyNow = (s, d, now) => s !== 'new' && Date.parse(d) <= now;
const ctd = (s, d, now) => isReadyNow(s, d, now) ? 1 : 0;
const rdy = (s, d, now) => isReadyNow(s, d, now) ? 1 : 0;
const rdyOf = c => (c && c.ready != null ? c.ready : (c ? c.due : 0)) || 0;
const emptyCount = () => ({ total:0, due:0, new:0, ready:0, next_due:null, upc:[] });
// upc = مواعيد البطاقات القادمة (ms) بترتيب تصاعدي، و next_due = أقربها
function setUpc(c, list){
  const up = list.filter(Number.isFinite).sort((a, b) => a - b).slice(0, UPC_MAX);
  c.upc = up; c.next_due = up.length ? new Date(up[0]).toISOString() : null;
}
// ينقل ما حان موعده من القادمة إلى المستحقة (بلا أي طلب شبكة)
function settleDeck(c, now = Date.now()){
  if (!c) return 0;
  const src = Array.isArray(c.upc) ? c.upc : (c.next_due ? [Date.parse(c.next_due)] : []);
  const n = src.filter(x => Number.isFinite(x) && x <= now).length;
  if (c.ready == null) c.ready = c.due || 0;
  if (n) { c.ready += n; c.due = (c.due || 0) + n; }
  setUpc(c, src.filter(x => x > now));
  return n;
}
function settleAll(now = Date.now()){ Object.keys(S.counts || {}).forEach(id => settleDeck(S.counts[id], now)); }
const snapCounts = id => { const c = S.counts[id]; return c ? Object.assign({}, c, { upc:(c.upc || []).slice() }) : null; };
function restoreCounts(id, snap){ if (snap) S.counts[id] = snap; else delete S.counts[id]; }
function adjustCounts(id, total, isNew, isDue, persist = true, isReady = 0){
  const c = S.counts[id] || (S.counts[id] = emptyCount());
  if (c.ready == null) c.ready = c.due || 0;
  c.total = Math.max(0, c.total + total); c.new = Math.max(0, c.new + isNew); c.due = Math.max(0, c.due + isDue); c.ready = Math.max(0, c.ready + isReady);
  if (persist) saveHomeKeep();
}
function streakValue(){
  const s = store.get('streak'); if (!s) return 0;
  const today = new Date().toLocaleDateString('en-CA'), yest = new Date(Date.now() - 864e5).toLocaleDateString('en-CA');
  return (s.last === today || s.last === yest) ? s.n : 0;
}
const settingsNow = () => Object.assign({}, DEFAULT_SETTINGS, S.settings || {});
const newUsed = () => (S.newToday.day === localDay() ? S.newToday.n : 0);
const newLeft = () => Math.max(0, settingsNow().new_per_day - newUsed());
function limitHit(id){ const c = S.counts[id]; return !!c && c.new > 0 && newLeft() === 0; }
const effNew = id => { const c = S.counts[id]; return c ? Math.min(c.new || 0, newLeft()) : 0; };
function fmtCd(ms){
  const s = Math.max(0, Math.ceil(ms / 1000));
  if (s >= 3600) return fmtMins(Math.round(s / 60));
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

// ===== الشاشة الرئيسية (شجرة مجلدات) =====
function subtreeIds(id){
  const ids = [id];
  S.folders.filter(f => f.parent_id === id).forEach(f => ids.push(...subtreeIds(f.id)));
  return ids;
}
function folderStats(id){
  const set = new Set(subtreeIds(id)), t = { decks:0, due:0, new:0 };
  S.decks.forEach(d => {
    if (!set.has(d.folder_id)) return;
    t.decks++;
    if (d.srs_enabled === false) return;
    const c = S.counts[d.id] || {}; t.due += c.due || 0; t.new += c.new || 0;
  });
  return t;
}
function crumbsHtml(){
  const chain = []; let f = S.folders.find(x => x.id === S.cwd);
  while (f) { chain.unshift(f); f = S.folders.find(x => x.id === f.parent_id); }
  if (!chain.length) return '';
  return `<div class="crumbs"><button data-a="cd" data-id="">الرئيسية</button>` +
    chain.map(c => ` › <button data-a="cd" data-id="${c.id}">${esc(c.name)}</button>`).join('') + '</div>';
}
function folderHtml(f){
  const st = folderStats(f.id), eff = Math.min(st.new, newLeft());
  return `<div class="deck" style="--dc:${COLORS[f.color] || COLORS.blue}" data-a="cd" data-id="${f.id}"><div class="bar"></div>
  <div class="fic">${ic(ICONS.includes(f.icon) ? f.icon : 'folder')}</div>
  <div class="dbody"><div class="dname">${esc(f.name)}</div><div class="meta"><span>${st.decks} مجموعة</span>
  ${st.due ? `<span class="b due">${st.due} مستحقة</span>` : ''}${st.new ? `<span class="b new ${eff ? '' : 'off'}">${eff || st.new} جديدة</span>` : ''}</div></div>
  <div class="acts"><button class="ib" data-a="editFolder" data-id="${f.id}">${ic('pencil')}</button></div></div>`;
}
function deckHtml(d){
  const c = S.counts[d.id] || { total:0, due:0, new:0 }, cram = d.srs_enabled === false, eff = effNew(d.id);
  const nd = c.next_due ? Date.parse(c.next_due) - Date.now() : 0;
  // العدّ التنازلي شارة مستقلة داخل .meta (لا يلتصق باسم المجموعة ولا يقطع الكلمات العربية)
  const cd = !cram && nd > 0
    ? `<span class="cd" dir="rtl" data-cd="${esc(c.next_due)}" data-p="التالي بعد: " data-id="${d.id}">التالي بعد: ${fmtCd(nd)}</span>` : '';
  const badges = cram ? '' : `${c.due ? `<span class="b due">${c.due} مستحقة</span>` : ''}${c.new ? `<span class="b new ${eff ? '' : 'off'}">${eff || c.new} جديدة</span>` : ''}`;
  const dead = !c.total;
  return `<div class="deck" data-deck="${d.id}" style="--dc:${COLORS[d.color] || COLORS.blue}"><div class="bar"></div>
  <div class="dbody" data-a="open" data-id="${d.id}"><div class="dname">${esc(d.name)}</div><div class="meta"><span>${c.total} بطاقة</span>${cram ? '<span class="b cram">Cram</span>' : ''}${badges}${cd}</div></div>
  <div class="acts"><button class="btn sm pri${dead ? ' dead' : ''}" data-a="study" data-id="${d.id}" ${dead ? 'disabled' : ''}>دراسة</button>
  <button class="ib" data-a="open" data-id="${d.id}">${ic('chevron-left')}</button></div></div>`;
}
// تحديث صف مجموعة واحد مباشرة بدل إعادة رسم الشاشة كاملة
function patchDeckRow(id){
  const d = S.decks.find(x => x.id === id);
  const old = [...document.querySelectorAll('.deck[data-deck]')].find(el => el.dataset.deck === id);

function renderHome(skeleton){
  setView('home'); settleAll();
  const folders = S.folders.filter(f => (f.parent_id || null) === S.cwd), decks = S.decks.filter(d => (d.folder_id || null) === S.cwd);
  const list = skeleton ? '<div class="sk"></div>'.repeat(3)
    : (folders.length || decks.length ? folders.map(folderHtml).join('') + decks.map(deckHtml).join('')
      : `<div class="empty">${ic(S.cwd ? 'folder-open' : 'layers')}<p>${S.cwd ? 'هذا المجلد فارغ' : 'لا يوجد شيء هنا بعد'}</p></div>`);
  paint(`<header class="top"><div class="logo" data-a="logo">${LOGO_SVG}<span><b>Pseudo</b> Card</span></div>

  <div class="row gap"><button class="btn" data-a="receive">${ic('download')} استلام</button>
  <button class="btn" data-a="newFolder">${ic('folder-plus')} مجلد</button>
  <button class="btn pri" data-a="create">${ic('plus')} مجموعة</button></div>${crumbsHtml()}<div class="list">${list}</div>`);
  syncBack();
}
function changeFolder(id){ S.cwd = id || null; renderHome(false); }
let homeFetch = null;
async function showHome(){
  const c = store.get('home');
  if (c) loadCached(c);
  if (S.cwd && !S.folders.some(f => f.id === S.cwd)) S.cwd = null;
  renderHome(!c);
  if (c && Date.now() - c.t < FRESH_MS) return;
  await refreshHome(!!c);
  if (S.view === 'home') renderHome(false);
}
// طلب واحد فقط في آنٍ واحد؛ لا يُرسل شيئاً إن فشل الـ Flush (غالباً بلا اتصال) ولا يستبدل البيانات إن بدأت جلسة أو وُجد تقدم غير مُرسل
function refreshHome(hasCache){
  if (homeFetch) return homeFetch;
  homeFetch = (async () => {
    try {
      if (!(await flush())) return;
      if (S.study) return;
      const day = localDay(), d = await call(() => db.rpc('home_snapshot', { p_day:day }));
      if (!d || !Array.isArray(d.decks)) throw new Error('bad data');
      if (S.study || Object.keys(S.pending).length) return;
      const counts = d.counts || {};
      Object.keys(counts).forEach(id => {
        const k = counts[id] || (counts[id] = emptyCount());
        k.upc = (Array.isArray(k.upc) ? k.upc : []).map(x => Date.parse(x)).filter(Number.isFinite);
        if (k.ready == null) k.ready = k.due || 0;
      });
      S.decks = d.decks; S.folders = d.folders || []; S.counts = counts; S.settings = d.settings || null;
      settleAll();
      S.newToday = { day, n:(d.new_today || 0) + unsentNew() };
      saveHome();
    } catch (e) {
      console.error('[PseudoCard] home refresh failed:', e);
      if (!hasCache) toast(errText(e, 'home_snapshot'));
      else if (!NET_RE.test(errRaw(e))) blackBox(e, 'home_snapshot');
    }
    finally { homeFetch = null; }
  })();
  return homeFetch;
}

const busy = new Set();
async function once(key, fn){ if (busy.has(key)) return; busy.add(key); try { return await fn(); } finally { busy.delete(key); } }
function saveFolderAction(){
  return once('folder', async () => {
    const name = clip(val('#fname'), 120), d = folderDraft;
    if (!name) return toast('اكتب اسم المجلد');
    try {
      if (d.id) {
        await call(() => db.from('folders').update({ name, icon:d.icon, color:d.color }).eq('id', d.id));
        const f = S.folders.find(x => x.id === d.id); if (f) Object.assign(f, { name, icon:d.icon, color:d.color });
      } else {
        const row = await call(() => db.from('folders').insert({ name, icon:d.icon, color:d.color, parent_id:S.cwd }).select('id,name,icon,color,parent_id').single());
        S.folders.push(row);
      }
      saveHomeKeep(); closeModal(); renderHome(false);
    } catch (e) { toast(errText(e)); }
  });
}
function deleteFolder(id){
  tg.showConfirm('حذف المجلد وكل ما بداخله؟', async ok => {
    if (!ok) return;
    const ids = new Set(subtreeIds(id)), oldF = S.folders, oldD = S.decks, oldC = Object.assign({}, S.counts);
    S.folders = S.folders.filter(f => !ids.has(f.id)); S.decks = S.decks.filter(d => !ids.has(d.folder_id));
    saveHomeKeep(); closeModal(); renderHome(false);
    try {
      await call(() => db.from('folders').delete().eq('id', id));
      oldD.filter(d => ids.has(d.folder_id)).forEach(d => { dropCards(d.id); store.del('study:' + d.id); delete S.counts[d.id]; });
      saveHomeKeep();
    } catch (e) { S.folders = oldF; S.decks = oldD; S.counts = oldC; saveHomeKeep(); renderHome(false); toast('فشل الحذف، تمت الاستعادة'); }
  });
}

  while (f && chain.length < 30) { chain.unshift(f); f = S.folders.find(x => x.id === f.parent_id); }
  return chain;
}
function folderPath(id){ const c = folderChain(id); return c.length ? 'الرئيسية › ' + c.map(f => f.name).join(' › ') : 'الرئيسية'; }
function openFolderPicker(start, onPick){ picker = { cur:start || null, onPick }; openModal('<div id="pickBox"></div>'); renderPicker(); }

function moveDeckModal(id){ const deck = S.decks.find(d => d.id === id); if (!deck) return; openFolderPicker(deck.folder_id, fid => applyMoveDeck(id, fid)); }
async function applyMoveDeck(id, target){
  const deck = S.decks.find(d => d.id === id); if (!deck) return;
  const old = deck.folder_id || null;
  if (target === old) return toast('المجموعة موجودة في هذا المجلد بالفعل');
  deck.folder_id = target; saveHomeKeep();
  try { await call(() => db.from('decks').update({ folder_id:target }).eq('id', id)); toast('تم النقل'); }
  catch (e) { deck.folder_id = old; saveHomeKeep(); toast(errText(e)); }
}

// ===== حذف مجموعة وتبديل SRS =====
function deleteDeck(id){
  tg.showConfirm('حذف المجموعة وكل بطاقاتها؟', async ok => {
    if (!ok) return;
    const idx = S.decks.findIndex(d => d.id === id); if (idx < 0) return;
    const deck = S.decks[idx], counts = S.counts[id];
    S.decks.splice(idx, 1); delete S.counts[id]; saveHomeKeep(); renderHome(false);
    try { await call(() => db.from('decks').delete().eq('id', id)); dropCards(id); store.del('study:' + id); }
    catch (e) {
      console.error('[PseudoCard]', e);
      S.decks.splice(Math.min(idx, S.decks.length), 0, deck); if (counts) S.counts[id] = counts;
      saveHomeKeep(); renderHome(false); toast('فشل الحذف، تمت الاستعادة');
    }
  });
}
const togglingSrs = new Set();
async function toggleSrs(id, el){
  const deck = S.decks.find(d => d.id === id);
  if (!deck || !el) return;
  if (togglingSrs.has(id)) { el.checked = deck.srs_enabled !== false; return; }
  const value = !!el.checked, old = deck.srs_enabled !== false;
  if (value === old) return;
  togglingSrs.add(id); el.disabled = true;
  const savedSession = store.get('study:' + id);
  deck.srs_enabled = value;
  store.del('study:' + id); // جلسة محفوظة بوضع مختلف لا قيمة لها
  saveHomeKeep(); toast(value ? 'SRS مفعّل' : 'وضع Cram: بدون جدولة');
  try { await call(() => db.from('decks').update({ srs_enabled:value }).eq('id', id)); }
  catch (e) {
    deck.srs_enabled = old; el.checked = old;
    if (savedSession) store.set('study:' + id, savedSession);
    saveHomeKeep(); toast(errText(e));
  } finally { togglingSrs.delete(id); el.disabled = false; }
}

// ===== الإنشاء =====
let createMode = 'new', createFolder = null, createExtra = [];
const NO_CARDS_MSG = 'لم يتم العثور على البطاقات. تأكد من وجود الرمز ( :: ) بين السؤال والجواب';
const allCards = () => parseCards(val('#paste')).concat(createExtra);
function updatePreview(){
  const box = $('#preview'); if (!box) return;
  const text = val('#paste'), cards = allCards();
  if (cards.length) { box.className = 'muted'; box.textContent = `${cards.length} بطاقة\n` + cards.slice(0, 2).map(c => `• ${c.front} ← ${c.back}`).join('\n'); }
  else if (text.trim()) { box.className = 'alert'; box.textContent = NO_CARDS_MSG; }
  else { box.className = 'muted'; box.textContent = ''; }
}
function applyJson(){
  const raw = val('#jsonIn').trim(), box = $('#preview');
  if (!raw) return toast('الصق JSON أولاً');
  const cards = jsonCards(raw);
  if (!cards || !cards.length) { if (box) { box.className = 'alert'; box.textContent = 'JSON غير صالح أو لا يحتوي بطاقات بصيغة {"front","back"}'; } return; }
  createExtra = createExtra.concat(cards);
  const jin = $('#jsonIn'), jb = $('#jsonBox'); if (jin) jin.value = ''; if (jb) jb.classList.add('hide');
  updatePreview(); toast(`أُضيفت ${cards.length} بطاقة للمعاينة`);
}
// استخراج بطاقات من JSON: مصفوفة، {cards}، أو تصدير التطبيق {decks:[{cards}]}
function jsonCards(text){
  const t = text.trim(); if (t[0] !== '[' && t[0] !== '{') return null;
  let j; try { j = JSON.parse(t); } catch { return null; }
  const list = Array.isArray(j) ? j : (j && Array.isArray(j.cards) ? j.cards : (j && Array.isArray(j.decks) ? j.decks : []));
  return sanitizeCards(list.flatMap(x => (x && Array.isArray(x.cards)) ? x.cards : [x]));
}
function parseCards(text){
  const j = jsonCards(text); if (j) return j;
  return text.split('\n')
    .map(l => l.replace(/^\s*(```.*|[-*•]\s+|\d+[.)]\s+)/, '').trim())
    .filter(l => l.includes('::'))
    .map(l => { const i = l.indexOf('::'); return { front:l.slice(0, i).trim().slice(0, 2000), back:l.slice(i + 2).trim().slice(0, 4000) }; })
    .filter(c => c.front && c.back);
}

    if (r && r.value) { store.set('prompt', r.value); setText('#prompt', r.value); }
  } catch (e) { console.error('[PseudoCard] loadPrompt failed:', e); }
}

// ===== خوارزمية SRS محلية (قابلة للضبط) =====
const UNITS = [{ m:1, t:'دقيقة' }, { m:60, t:'ساعة' }, { m:1440, t:'يوم' }];
function splitMins(m){ return m % 1440 === 0 ? { n:m / 1440, u:1440 } : (m % 60 === 0 ? { n:m / 60, u:60 } : { n:m, u:1 }); }
function srsConfig(){
  const s = settingsNow(), D = DEFAULT_SETTINGS, pick = k => (+s[k] >= 1 ? Math.round(+s[k]) : D[k]);
  return { again:pick('step_again'), hard:pick('step_hard'), good:pick('step_good'), easy:pick('step_easy'), maxIvl:Math.max(1, +s.max_interval || 365) };
}
// جديدة/تعلّم/إعادة تعلّم: الفواصل من الإعدادات (نسيت/صعبة/جيدة/سهلة)
function stepLearning(card, r, cfg){
  const isNew = card.state === 'new', isRe = card.state === 'relearning', base = Math.max(1, +card.ivl_days || 1);
  const out = { state:isNew ? 'learning' : card.state, step:0, ease:+card.ease, ivl:+card.ivl_days, lapses:+card.lapses, mins:cfg.again };
  if (r === 1) return out;
  if (r === 2) { if (isNew) out.ease -= 0.15; out.step = +card.step || 0; out.mins = cfg.hard; return out; }
  const pass = (mins, days, bonus) => Object.assign(out, { state:'review', step:0, ease:out.ease + bonus, ivl:days, mins });
  if (r === 3) {
    if (!isRe && cfg.good < 1440 && !(+card.step > 0)) { out.step = 1; out.mins = cfg.good; return out; }
    return isRe ? pass(base * 1440, base, 0) : pass(Math.max(cfg.good, 1440), Math.max(1, cfg.good / 1440), 0);
  }
  if (isRe) { const d = Math.ceil(base * 1.3); return pass(d * 1440, d, 0); }
  return pass(Math.max(cfg.easy, 1440), Math.max(1, cfg.easy / 1440), isNew ? 0.15 : 0);
}
// تشويش ثابت لكل بطاقة (المعاينة على الزر = الفاصل الفعلي)
function fuzz(card){ const h = parseInt(String(card.id).slice(-4), 16) || 0; return 0.95 + ((h + (+card.reps || 0) * 7919) % 1000) / 10000; }
function stepReview(card, r, cfg){
  let ease = +card.ease, ivl = +card.ivl_days;
  if (r === 1) return { state:'relearning', step:0, ease:ease - 0.2, ivl:Math.max(1, Math.round(ivl * 0.5)), lapses:+card.lapses + 1, mins:cfg.again };
  const mult = r === 2 ? 1.2 : (r === 3 ? ease : ease * 1.3);
  if (r === 2) ease -= 0.15;
  if (r === 4) ease += 0.15;
  ivl = Math.min(cfg.maxIvl, Math.max(Math.min(ivl + 1, cfg.maxIvl), ivl * mult * fuzz(card)));
  return { state:'review', step:0, ease, ivl, lapses:+card.lapses, mins:Math.round(ivl * 1440) };
}
function schedule(card, r, srs = true){
  const now = Date.now(), stamp = new Date(now).toISOString();
  if (!srs) return { mins:0, again:r === 1, row:{ reps:+card.reps + 1, last_review:stamp } };
  const cfg = srsConfig(), o = card.state === 'review' ? stepReview(card, r, cfg) : stepLearning(card, r, cfg);
  const row = { state:o.state, step:o.step, ease:Math.round(Math.min(3, Math.max(1.3, o.ease)) * 100) / 100,
    ivl_days:Math.round(o.ivl * 100) / 100, reps:+card.reps + 1, lapses:o.lapses,
    due:new Date(now + o.mins * 6e4).toISOString(), last_review:stamp };
  if (card.state === 'new') row.first_seen = stamp;
  return { mins:o.mins, again:o.mins <= 10, row };
}
function fmtMins(m){ return m < 60 ? `${m}د` : (m < 1440 ? `${Math.round(m / 60)}س` : `${Math.round(m / 1440)}ي`); }

// ===== الإرسال بالدفعات (Flush) =====
let flushP = null;
const newCnt = () => store.get('newcnt', {});
const unsentNew = () => newCnt()[localDay()] || 0;
// تسجيل بطاقة جديدة قُيّمت: محلياً فوراً، وتُرسل للعدّاد دفعة واحدة مع الـ Flush
function countNew(){
  const day = localDay(), m = newCnt(); m[day] = (m[day] || 0) + 1; store.set('newcnt', m);
  S.newToday = { day, n:newUsed() + 1 };
}
function ackCounts(sent){
  const cur = newCnt();
  Object.keys(sent).forEach(d => { cur[d] = (cur[d] || 0) - sent[d]; if (cur[d] <= 0) delete cur[d]; });
  Object.keys(cur).length ? store.set('newcnt', cur) : store.del('newcnt');
}
// طلب واحد لكل دفعة (حتى 200 تقييم). استدعاءات Flush المتزامنة تشترك في نفس الطلب الجاري
function flush(){ if (!flushP) flushP = doFlush().finally(() => { flushP = null; }); return flushP; }
const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const DAY_RE = /^\d{4}-\d{2}-\d{2}$/;
const num = (v, d) => { const x = Number(v); return Number.isFinite(x) ? x : d; };
const isoOrNull = v => (typeof v === 'string' && Number.isFinite(Date.parse(v))) ? v : null;
// تنظيف صف تقييم قبل إرساله: صف تالف واحد لا يجوز أن يعطّل الدفعة كلها إلى الأبد
function cleanPending(r){
  if (!r || !UUID_RE.test(String(r.id)) || !['learning', 'review', 'relearning'].includes(r.state)) return null;
  return { id:r.id, state:r.state, step:Math.max(0, Math.round(num(r.step, 0))), ease:num(r.ease, 2.5), ivl_days:Math.max(0, num(r.ivl_days, 0)),
    reps:Math.max(0, Math.round(num(r.reps, 0))), lapses:Math.max(0, Math.round(num(r.lapses, 0))),
    due:isoOrNull(r.due) || new Date().toISOString(), last_review:isoOrNull(r.last_review), first_seen:isoOrNull(r.first_seen) };
}
function cleanCounts(cnt){
  const out = {};
  Object.keys(cnt || {}).forEach(d => { const n = Math.floor(num(cnt[d], 0)); if (DAY_RE.test(d) && n > 0) out[d] = Math.min(n, 5000); });
  return out;
}
async function doFlush(){
  const ids = Object.keys(S.pending), cnt = newCnt();
  if (!ids.length && !Object.keys(cnt).length) return true;
  try {
    const pairs = [];
    ids.forEach(i => {
      const orig = S.pending[i], clean = cleanPending(orig);

async function startStudy(id, fresh = false, forceCram = false){

    else st.cramUnknown = st.cramUnknown.filter(c => c.id !== card.id);

  <div class="panel row">${u.photo_url ? `<img class="avatar" src="${esc(u.photo_url)}">` : '<div class="avatar"></div>'}
  <div><b style="margin:0">${esc((u.first_name || '') + ' ' + (u.last_name || ''))}</b><div class="muted">${u.username ? '@' + esc(u.username) : ''}</div></div></div>
  <div class="panel"><b>رمز الاسترداد</b><div class="muted" style="direction:ltr">${esc(uid.slice(0, 8))}…</div>
  <div class="muted">احتفظ بالرمز الكامل لاسترداد حسابك — تواصل مع الدعم في حال فقدانه.</div>
  <button class="btn wide" data-a="copyText" data-id="${esc(uid)}">${ic('copy')} نسخ الرمز الكامل</button></div>
  <div class="panel"><b>خوارزمية المراجعة</b>${srsRowsHtml(cfg)}<div class="muted" style="margin-bottom:8px">الفاصل بعد كل زر للبطاقات الجديدة وبعد النسيان، ثم تتضاعف الفواصل تلقائياً.</div>
  <label class="muted">الحد الأقصى للفاصل (أيام)</label>
  <input id="maxIn" type="number" min="1" max="3650" value="${cfg.max_interval}"><label class="muted">البطاقات الجديدة يومياً</label>
  <input id="newIn" type="number" min="0" max="500" value="${cfg.new_per_day}"><button class="btn pri wide" data-a="saveSrs">حفظ</button></div>
  <div class="panel"><b>المظهر</b><div class="row gap">${[['auto', 'تلقائي'], ['light', 'فاتح'], ['dark', 'داكن']].map(([k, t]) => `<button class="btn ${store.get('theme', 'auto') === k ? 'sel' : ''}" data-a="theme" data-id="${k}">${t}</button>`).join('')}</div></div>
  <div class="panel"><button class="btn wide" data-a="exportAll">${ic('database')} تصدير بياناتي</button>
  <button class="btn wide" data-a="bot">${ic('bot')} فتح البوت</button></div>`);
}
async function saveSrsAction(){
  const row = {}, maxIvl = parseInt(val('#maxIn'), 10), perDay = parseInt(val('#newIn'), 10);
  for (const k of ['step_again', 'step_hard', 'step_good', 'step_easy']) {
    const n = parseInt(val('#' + k + '_n'), 10); row[k] = n * (+val('#' + k + '_u') || 1);
    if (!(n >= 1) || row[k] > 5256000) return toast('قيمة غير صالحة في أحد الأزرار');
  }
  if (!(row.step_again <= row.step_hard && row.step_hard <= row.step_good && row.step_good <= row.step_easy)) return toast('الترتيب المطلوب: نسيت ≤ صعبة ≤ جيدة ≤ سهلة');
  if (!(maxIvl >= 1 && maxIvl <= 3650)) return toast('الحد الأقصى بين 1 و 3650 يوماً');
  if (!(perDay >= 0 && perDay <= 500)) return toast('الجديدة يومياً بين 0 و 500');
  Object.assign(row, { max_interval:maxIvl, new_per_day:perDay });
  try {
    await call(() => db.from('user_settings').upsert(Object.assign({ user_id:S.session.user_id }, row), { onConflict:'user_id' }));
    S.settings = row; saveHomeKeep(); toast('تم الحفظ');
  } catch (e) { toast(errText(e)); }
}
async function exportAll(){
  try {
    const rows = [];
    for (let i = 0; i < 20000; i += 1000) {
      const part = await call(() => db.from('cards').select('deck_id,front,back').order('created_at').order('id').range(i, i + 999));
      rows.push(...part); if (part.length < 1000) break;
    }
    const decks = S.decks.map(d => ({ name:d.name, folder_id:d.folder_id, cards:rows.filter(r => r.deck_id === d.id).map(r => ({ front:r.front, back:r.back })) }));
    if (rows.length >= 20000) tg.showAlert('تم تصدير أول 20000 بطاقة فقط.');
    copyText(JSON.stringify({ folders:S.folders, decks }));
  } catch (e) { toast(errText(e)); }
}

// ===== المشرف (6 نقرات خلال 4 ثوان) =====
let logoTaps = 0, logoFirst = 0;
function logoTap(){
  const now = Date.now();
  if (now - logoFirst > 4000) { logoTaps = 0; logoFirst = now; }
  if (++logoTaps >= 6) { logoTaps = 0; openAdmin(); }
}
const fmtErrTime = t => { const d = new Date(t); return Number.isNaN(d.getTime()) ? String(t || '') : d.toLocaleString('en-GB') + '  (' + d.toISOString() + ')'; };
function copyLastError(){ const l = store.get('last_error'); if (l) copyText((l.time || '') + '\n' + (l.msg || '')); }
function clearLastError(){ store.del('last_error'); closeModal(); toast('تم مسح السجل'); }
async function openAdmin(){
  const last = store.get('last_error');   // يُقرأ أولاً: أي طلب لاحق قد يستبدله
  let admin = store.get('is_admin', false);
  try { admin = !!(await call(() => db.rpc('is_admin'))); store.set('is_admin', admin); }
  catch (e) { console.error('[PseudoCard] is_admin failed:', e); if (!admin) return toast(friendlyErr(e)); }
  if (!admin) return toast('غير مصرّح');
  let stats = null, cfg = null;
  try { stats = await call(() => db.rpc('admin_stats')); } catch (e) { console.error('[PseudoCard] admin_stats failed:', e); }
  try { cfg = await call(() => db.from('app_config').select('value').eq('key', 'prompt_base').maybeSingle()); } catch (e) { console.error('[PseudoCard] app_config failed:', e); }
  const box = last && last.msg
    ? `<div class="alert bb"><small>آخر خطأ · ${esc(fmtErrTime(last.time))}</small>${esc(last.msg)}</div>
    <div class="row gap" style="margin-bottom:10px"><button class="btn sm" data-a="copyErr">${ic('copy')} نسخ الخطأ</button><button class="btn sm" data-a="clearErr">${ic('trash-2')} مسح</button></div>` : '';
  const st = stats ? `users ≈${stats.users} · decks ≈${stats.decks} · cards ≈${stats.cards} · shares ≈${stats.shares}` : 'تعذّر تحميل الإحصاءات';
  openModal(`<h3>لوحة المشرف</h3>${box}<div class="muted" style="direction:ltr">${esc(st)}</div>
  <textarea id="adminPrompt" rows="8">${esc(cfg && cfg.value ? cfg.value : '')}</textarea><button class="btn pri wide" data-a="savePrompt">حفظ التعليمات</button>`);
}
async function savePrompt(){
  const value = val('#adminPrompt').trim(); if (!value) return;
  try { await call(() => db.from('app_config').upsert({ key:'prompt_base', value })); store.set('prompt', value); closeModal(); toast('تم الحفظ'); }
  catch (e) { toast(errText(e)); }
}

// ===== توزيع الأحداث =====
const actions = {
  study:id => startStudy(id), studyHere:id => startStudy(id), nextBatch:id => startStudy(id, true), open:id => openDeck(id),
  del:id => { deleteDeck(id); }, create:() => renderCreate(), addCards:id => renderCreate({ deckId:id }),
  receive:() => receiveModal(), settings:renderSettings, home:showHome, back:showHome, exit:exitStudy, cd:id => changeFolder(id),
  newFolder:() => folderModal(null), editFolder:id => folderModal(id), pickIcon:id => pickDraft('icon', id), pickColor:id => pickDraft('color', id),
  saveFolder:saveFolderAction, delFolder:id => deleteFolder(id), shareFolder:id => shareFolder(id),
  moveDeck:id => moveDeckModal(id), toggleSrs:(id, el) => toggleSrs(id, el),
  pk:id => { picker.cur = id || null; renderPicker(); }, pkSelect:() => { const { cur, onPick } = picker; closeModal(); if (onPick) onPick(cur); },
  pickCreateFolder:() => openFolderPicker(createFolder, fid => { createFolder = fid; setText('#folderLbl', folderPath(fid)); }),
  shareDeck:id => shareDeck(id), copyLink:id => copyText(`${APP_LINK}?startapp=deck_${id}`),
  exportDeck:() => copyText(JSON.stringify(deckCtx.cards.map(c => ({ front:c.front, back:c.back })), null, 1)),
  cramNow:id => { closeModal(); startStudy(id, true, true); }, offerStudy:id => { closeModal(); startStudy(id, true); }, closeSheet:() => closeModal(),
  jsonToggle:() => { const b = $('#jsonBox'); if (b) b.classList.toggle('hide'); }, jsonApply:applyJson,
  cramUnknown:reviewUnknown, cramAll:id => startStudy(id, true, true), mode:id => setMode(id), copyPrompt:() => copyText(store.get('prompt', DEFAULT_PROMPT) + '\n\nالمصدر:\n'), saveCreate:saveCreateAction,
  editCard:id => editCardModal(id), saveCard:id => saveCardAction(id), delCard:id => deleteCard(id),
  doReceive:receiveAction, copyText:id => copyText(id), exportAll, flip:flipCard, rate:id => rateCard(+id), saveSrs:saveSrsAction,
  theme:id => { store.set('theme', id); applyTheme(); markTheme(); }, bot:() => tg.openTelegramLink(BOT_LINK), savePrompt, logo:logoTap, copyErr:copyLastError, clearErr:clearLastError,
  tgShare:id => tg.openTelegramLink('https://t.me/share/url?url=' + id + '&text=' + encodeURIComponent('Pseudo Card'))
};
function runAction(el){
  const fn = actions[el.dataset.a]; if (!fn) return;
  const fail = e => { console.error('[PseudoCard]', e); toast(errText(e)); };
  try { const r = fn(el.dataset.id, el); if (r && typeof r.catch === 'function') r.catch(fail); } catch (e) { fail(e); }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (el) runAction(el);
});
document.addEventListener('keydown', e => {
  if (S.view !== 'study' || modals) return;
  if (e.code === 'Space') { e.preventDefault(); flipCard(); }
  else if (['1', '2', '3', '4'].includes(e.key)) rateCard(+e.key);
});
window.addEventListener('unhandledrejection', e => { console.error('[PseudoCard] unhandled:', e.reason); if (!NET_RE.test(errRaw(e.reason))) blackBox(e.reason, 'unhandled'); });
window.addEventListener('error', e => { if (!e.error && !e.message) return; if (e.message === 'Script error.') return; console.error('[PseudoCard] window error:', e.error || e.message); blackBox(e.error || e.message, 'window.onerror'); });

// ===== التشغيل =====
function handleStartParam(){
  const p = tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  if (!p) return;
  if (p.startsWith('deck_')) startStudy(p.slice(5));
  else if (/^[0-9a-f]{8}$/i.test(p)) receiveModal(p);
}
function flushIfPending(){ if (Object.keys(S.pending).length || Object.keys(newCnt()).length) flush(); }
function onHide(){ saveHomeNow(); flushIfPending(); }
async function boot(){
  tg.ready(); tg.expand();
  try { tg.setHeaderColor('secondary_bg_color'); } catch {}
  if (!tg.initData) {
    document.body.innerHTML = '<div class="empty" style="padding:80px 20px"><h2>Pseudo Card</h2><p>افتح التطبيق من داخل تيليجرام</p></div>'; return;
  }
  applyTheme(); S.pending = store.get('pending', {});
  tg.BackButton.onClick(handleBack);
  const cached = store.get('home');
  if (cached) { loadCached(cached); renderHome(false); }
  else renderHome(true);
  try { await ensureSession(); }
  catch (e) { S.session = store.get('session'); if (!S.session) { toast(errText(e)); return; } }
  await showHome(); handleStartParam(); flushIfPending();
  setInterval(flushIfPending, FLUSH_EVERY); setInterval(tick, 1000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) onHide(); else tick(); });
  window.addEventListener('pagehide', onHide);
}
boot();
</script>
