<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pseudo Card</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;600&family=Cinzel:wght@600&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<style>
:root{--ac:#2f6fe4;--ok:#16a34a;--warn:#f59e0b;--err:#dc2626;--new:#8b5cf6;--bg:#f4f6fb;--card:#fff;--tx:#0f172a;--mut:#64748b;--bd:#e2e8f0;--r:14px;--sh:0 4px 18px rgba(15,23,42,.08)}
[data-theme=dark]{--bg:#0b1020;--card:#151b2e;--tx:#e8ecf5;--mut:#94a3b8;--bd:#25304a;--sh:0 4px 18px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Inter,sans-serif;padding:env(safe-area-inset-top) 14px calc(20px + env(safe-area-inset-bottom))}
#app{max-width:560px;margin:0 auto}
button,input,textarea{font-family:inherit;font-size:15px;color:var(--tx)}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
.top h2{margin:0;font-size:18px}
.logo{font-family:Cinzel,serif;font-size:22px;user-select:none}
.row{display:flex;align-items:center;gap:8px}.gap>*{flex:1}
.streak{display:flex;align-items:center;gap:4px;font-weight:700;color:var(--warn)}
.btn{border:1px solid var(--bd);background:var(--card);border-radius:var(--r);padding:11px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .18s}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}.btn.sm{padding:7px 12px}.btn.wide{width:100%;margin-top:10px}
.btn:disabled{opacity:.45}.btn:active{transform:scale(.97)}
.ib{border:0;background:transparent;padding:8px;border-radius:10px;cursor:pointer;color:var(--mut);display:inline-flex}.ib.err{color:var(--err)}
.list{margin-top:14px}
.deck{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:10px;overflow:hidden}
.bar{width:6px;align-self:stretch;background:var(--dc)}.dbody{flex:1;padding:12px 0;min-width:0}
.dname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:4px}
.b{padding:1px 8px;border-radius:99px;color:#fff;font-weight:600}.b.due{background:var(--warn)}.b.new{background:var(--new)}.b.ok{background:var(--ok)}
.acts{display:flex;align-items:center;padding-inline-end:6px}
.sk{height:78px;border-radius:var(--r);margin-bottom:10px;background:linear-gradient(90deg,var(--bd),var(--card),var(--bd));background-size:200%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200%}}
.empty{text-align:center;color:var(--mut);padding:50px 0}
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.panel b{display:block;margin-bottom:8px}
textarea,input[type=text],input:not([type]){width:100%;border:1px solid var(--bd);background:var(--bg);border-radius:12px;padding:10px;resize:vertical}
.prompt{white-space:pre-wrap;font-size:13px;color:var(--mut);background:var(--bg);padding:10px;border-radius:12px;margin:0 0 8px;max-height:120px;overflow:auto}
.muted{color:var(--mut);font-size:13px;margin-top:6px;white-space:pre-wrap}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .18s}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet h3{margin:0 0 10px}.sheet textarea,.sheet input{margin-bottom:8px}
.code{font-family:Inter,monospace;font-size:26px;letter-spacing:3px;text-align:center;direction:ltr;margin:10px 0;font-weight:700}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:99px;z-index:50;font-size:14px;animation:up .18s}
.study{display:flex;flex-direction:column;height:calc(100vh - 30px - env(safe-area-inset-top))}
.sh{display:flex;align-items:center;gap:10px;padding:10px 0}
.prog{flex:1;height:8px;background:var(--bd);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ac);width:0;transition:width .18s}
.stage{perspective:1000px;flex:1;display:flex;margin:6px 0 12px;min-height:200px}
.flip{position:relative;width:100%;transition:transform .4s;transform-style:preserve-3d}.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border-radius:20px;box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;font-size:20px;line-height:1.7;white-space:pre-wrap;overflow:auto}
.face.back{transform:rotateY(180deg);border:2px solid var(--ac)}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;min-height:62px}
.rates button{border:0;border-radius:var(--r);color:#fff;padding:10px 2px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:14px}
.rates small{font-weight:400;opacity:.9;font-size:11px}
.hint{grid-column:1/-1;text-align:center;color:var(--mut)}
.ci{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:10px;margin-bottom:8px;box-shadow:var(--sh)}
.ci div{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.done{text-align:center;padding:60px 0}.done h1{font-size:28px}
.avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--bd)}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ===== إعدادات (عدّلها) =====
const SUPABASE_URL = 'https://supabase.com/dashboard/project/prdlwxmslcbloinpzpnp/settings/api-keys';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InByZGx3eG1zbGNibG9pbnB6cG5wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzMDExMDYsImV4cCI6MjEwODg3NzEwNn0.ZqKqWQ09ms3r0IBj_8-VL4j5DsmHcV_juljuHaxZJu0';
const APP_LINK = 'https://t.me/YOUR_BOT/app';
const BOT_LINK = 'https://t.me/YOUR_BOT';

const FRESH_MS = 60000, BATCH = 30, FLUSH_AT = 50, FLUSH_EVERY = 60000;
const COLORS = { blue:'#2f6fe4', green:'#16a34a', violet:'#8b5cf6', amber:'#f59e0b', red:'#dc2626' };
const DEFAULT_PROMPT = 'أنت مساعد لإنشاء بطاقات مراجعة لطلاب الطب. اكتب البطاقات فقط داخل كتلة كود واحدة، بدون مقدمة أو شرح أو ترقيم. كل بطاقة في سطر واحد بهذه الصيغة بالضبط: الوجه :: الظهر. كل بطاقة تختبر فكرة واحدة قصيرة ودقيقة، ولا تضف معلومة غير موجودة في المصدر. اللغة: نفس لغة المصدر مع إبقاء المصطلحات الطبية بالإنجليزية.';

// ===== الحالة المركزية =====
const S = { session:null, decks:[], counts:{}, queue:[], pending:{}, view:'home', study:null };
const tg = window.Telegram.WebApp;
const authClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY,
  { auth:{ persistSession:false, autoRefreshToken:false, detectSessionInUrl:false } });
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY,
  { accessToken: async () => S.session && S.session.access_token });

// ===== أدوات =====
const $ = s => document.querySelector(s);
const ic = n => `<i data-lucide="${n}"></i>`;
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wait = ms => new Promise(r => setTimeout(r, ms));
const store = {
  get(k, d = null){ try { const v = localStorage.getItem('pc:' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem('pc:' + k, JSON.stringify(v)); } catch {} },
  del(k){ try { localStorage.removeItem('pc:' + k); } catch {} }
};
function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2400);
}
function haptic(kind){
  try {
    if (kind === 'flip') tg.HapticFeedback.impactOccurred('light');
    else tg.HapticFeedback.notificationOccurred(kind);
  } catch {}
}
function errText(e){
  const m = (e && e.message) || '';
  if (m.includes('rate limited')) return 'انتظر دقيقة ثم أعد المحاولة';
  if (m.includes('Failed to fetch')) return 'لا يوجد اتصال بالإنترنت';
  return 'حدث خطأ، حاول مجدداً';
}
async function copyText(text){
  try { await navigator.clipboard.writeText(text); }
  catch { const a = document.createElement('textarea'); a.value = text; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); }
  toast('تم النسخ');
}
function paint(html){ $('#app').innerHTML = html; lucide.createIcons(); window.scrollTo(0, 0); }

// ===== الجلسة (طلب فقط عند الحاجة) =====
function saveSession(x){
  const old = store.get('session');
  if (old && old.user_id !== x.user.id) Object.keys(localStorage).filter(k => k.startsWith('pc:') && k !== 'pc:theme').forEach(k => localStorage.removeItem(k));
  S.session = { access_token:x.access_token, refresh_token:x.refresh_token, expires_at:x.expires_at, user_id:x.user.id };
  store.set('session', S.session);
}
async function ensureSession(){
  const s = S.session || store.get('session');
  if (s && s.expires_at > Date.now() / 1000 + 300) { S.session = s; return; }
  if (s) {
    const r = await authClient.auth.refreshSession({ refresh_token: s.refresh_token });
    if (!r.error && r.data.session) return saveSession(r.data.session);
  }
  const r = await authClient.auth.signInAnonymously();
  if (r.error) throw r.error;
  saveSession(r.data.session);
}
async function call(fn, retries = 0){
  for (let i = 0; i <= retries; i++) {
    try { await ensureSession(); const r = await fn(); if (r.error) throw r.error; return r.data; }
    catch (e) { if (i === retries) throw e; await wait(800); }
  }
}

// ===== مودال وزر الرجوع =====
let modals = 0;
function syncBack(){ try { (modals > 0 || S.view !== 'home') ? tg.BackButton.show() : tg.BackButton.hide(); } catch {} }
function setView(v){ S.view = v; syncBack(); }
function openModal(html){
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="sheet">${html}</div>`;
  m.addEventListener('click', e => { if (e.target === m) closeModal(); });
  document.body.appendChild(m); modals++; lucide.createIcons(); syncBack();
}
function closeModal(){
  const all = document.querySelectorAll('.modal');
  if (all.length) { all[all.length - 1].remove(); modals--; syncBack(); }
}
function handleBack(){
  if (modals > 0) closeModal();
  else if (S.view === 'study') exitStudy();
  else showHome();
}

// ===== الشاشة الرئيسية =====
function saveHome(t = Date.now()){ store.set('home', { t, decks:S.decks, counts:S.counts }); }
function streakValue(){
  const s = store.get('streak'); if (!s) return 0;
  const today = new Date().toLocaleDateString('en-CA');
  const yest = new Date(Date.now() - 864e5).toLocaleDateString('en-CA');
  return (s.last === today || s.last === yest) ? s.n : 0;
}
function deckHtml(d){
  const c = S.counts[d.id] || { total:0, due:0, new:0 };
  const id = `data-id="${d.id}"`;
  return `<div class="deck" style="--dc:${COLORS[d.color] || COLORS.blue}"><div class="bar"></div>
  <div class="dbody"><div class="dname">${esc(d.name)}</div><div class="meta"><span>${c.total} بطاقة</span>
  ${c.due ? `<span class="b due">${c.due} مستحقة</span>` : ''}${c.new ? `<span class="b new">${c.new} جديدة</span>` : ''}</div></div>
  <div class="acts"><button class="btn sm pri" data-a="study" ${id} ${c.due + c.new ? '' : 'disabled'}>دراسة</button>
  <button class="ib" data-a="open" ${id}>${ic('pencil')}</button><button class="ib" data-a="share" ${id}>${ic('share-2')}</button>
  <button class="ib err" data-a="del" ${id}>${ic('trash-2')}</button></div></div>`;
}
function renderHome(skeleton){
  setView('home');
  const list = skeleton ? '<div class="sk"></div>'.repeat(3)
    : (S.decks.length ? S.decks.map(deckHtml).join('')
      : `<div class="empty">${ic('layers')}<p>لا توجد مجموعات بعد</p></div>`);
  paint(`<header class="top"><div class="logo" data-a="logo">Pseudo Card</div>
  <div class="row"><span class="streak">${ic('flame')} ${streakValue()}</span><button class="ib" data-a="settings">${ic('settings')}</button></div></header>
  <div class="row gap"><button class="btn" data-a="receive">${ic('download')} استلام بالكود</button>
  <button class="btn pri" data-a="create">${ic('plus')} مجموعة جديدة</button></div><div class="list">${list}</div>`);
}
async function showHome(){
  const c = store.get('home');
  if (c) { S.decks = c.decks; S.counts = c.counts; }
  renderHome(!c);
  if (c && Date.now() - c.t < FRESH_MS) return;
  try {
    const d = await call(() => db.rpc('home_snapshot'));
    S.decks = d.decks; S.counts = d.counts; saveHome();
  } catch (e) { if (!c) toast(errText(e)); }
  if (S.view === 'home') renderHome(false);
}
function markHomeStale(){ const h = store.get('home'); if (h) { h.t = 0; store.set('home', h); } }
function adjustCounts(id, total, isNew, isDue){
  const c = S.counts[id] || (S.counts[id] = { total:0, due:0, new:0 });
  c.total = Math.max(0, c.total + total); c.new = Math.max(0, c.new + isNew); c.due = Math.max(0, c.due + isDue);
  saveHome(store.get('home') ? store.get('home').t : Date.now());
}

// ===== حذف مجموعة (optimistic) =====
function deleteDeck(id){
  tg.showConfirm('حذف المجموعة وكل بطاقاتها؟', async ok => {
    if (!ok) return;
    const idx = S.decks.findIndex(d => d.id === id), deck = S.decks[idx], counts = S.counts[id];
    S.decks.splice(idx, 1); delete S.counts[id]; saveHome(store.get('home').t); renderHome(false);
    try { await call(() => db.from('decks').delete().eq('id', id)); store.del('cards:' + id); store.del('study:' + id); }
    catch (e) { S.decks.splice(idx, 0, deck); S.counts[id] = counts; saveHome(); renderHome(false); toast('فشل الحذف، تمت الاستعادة'); }
  });
}

// ===== الإنشاء (لصق رد الذكاء الاصطناعي) =====
function parseCards(text){
  return text.split('\n')
    .map(l => l.replace(/^\s*(```.*|[-*•]\s+|\d+[.)]\s+)/, '').trim())
    .filter(l => l.includes('::'))
    .map(l => { const i = l.indexOf('::'); return { front:l.slice(0, i).trim().slice(0, 2000), back:l.slice(i + 2).trim().slice(0, 4000) }; })
    .filter(c => c.front && c.back);
}
async function loadPrompt(){
  if (store.get('prompt')) return;
  try {
    const r = await call(() => db.from('app_config').select('value').eq('key', 'prompt_base').maybeSingle());
    if (r && r.value) { store.set('prompt', r.value); if ($('#prompt')) $('#prompt').textContent = r.value; }
  } catch {}
}
function renderCreate(){
  setView('create');
  paint(`<header class="top"><button class="ib" data-a="home">${ic('arrow-right')}</button><h2>مجموعة جديدة</h2><span></span></header>
  <div class="panel"><b>1) انسخ التعليمات وأعطها للذكاء الاصطناعي مع مادتك</b><pre id="prompt" class="prompt">${esc(store.get('prompt', DEFAULT_PROMPT))}</pre>
  <button class="btn" data-a="copyPrompt">${ic('copy')} نسخ التعليمات</button></div>
  <div class="panel"><b>2) الصق رد الذكاء الاصطناعي</b><textarea id="paste" rows="7" placeholder="الوجه :: الظهر"></textarea><div id="preview" class="muted"></div></div>
  <div class="panel"><b>3) اسم المجموعة</b><input id="dname" maxlength="120" placeholder="مثال: Cardiology"><button class="btn pri wide" id="saveBtn" data-a="saveDeck">${ic('check')} حفظ</button></div>`);
  $('#paste').addEventListener('input', () => {
    const cards = parseCards($('#paste').value);
    $('#preview').textContent = cards.length ? `${cards.length} بطاقة\n` + cards.slice(0, 2).map(c => `• ${c.front} ← ${c.back}`).join('\n') : '';
  });
  loadPrompt();
}
async function saveNewDeck(name, cards){
  const color = Object.keys(COLORS)[S.decks.length % 5];
  const deck = await call(() => db.from('decks').insert({ name, color }).select('id,name,color,created_at').single());
  for (let i = 0; i < cards.length; i += 500) {
    const rows = cards.slice(i, i + 500).map(c => ({ deck_id:deck.id, front:c.front, back:c.back }));
    await call(() => db.from('cards').insert(rows));
  }
  S.decks.unshift(deck); S.counts[deck.id] = { total:cards.length, due:0, new:cards.length }; saveHome();
  return deck;
}
async function saveDeckAction(){
  const name = $('#dname').value.trim(), cards = parseCards($('#paste').value);
  if (!name) return toast('اكتب اسم المجموعة');
  if (!cards.length) return toast('لم أجد بطاقات بصيغة الوجه :: الظهر');
  $('#saveBtn').disabled = true;
  try { await saveNewDeck(name, cards); toast('تم الحفظ'); showHome(); }
  catch (e) { toast(errText(e)); $('#saveBtn').disabled = false; }
}

// ===== تفاصيل المجموعة =====
let deckCtx = { id:null, cards:[], q:'' };
async function getDeckCards(id){
  const c = store.get('cards:' + id); if (c) return c;
  const rows = await call(() => db.from('cards').select('id,front,back,state,due').eq('deck_id', id).order('created_at').limit(2000));
  store.set('cards:' + id, rows); return rows;
}
function renderCardList(){
  const q = deckCtx.q.toLowerCase();
  const rows = deckCtx.cards.filter(c => !q || c.front.toLowerCase().includes(q) || c.back.toLowerCase().includes(q));
  $('#clist').innerHTML = rows.map(c => `<div class="ci"><div>${esc(c.front)}<br><small class="muted">${esc(c.back)}</small></div>
  <button class="ib" data-a="editCard" data-id="${c.id}">${ic('pencil')}</button><button class="ib err" data-a="delCard" data-id="${c.id}">${ic('trash-2')}</button></div>`).join('')
    || '<div class="empty">لا نتائج</div>';
  lucide.createIcons();
}
async function openDeck(id){
  const deck = S.decks.find(d => d.id === id); if (!deck) return;
  setView('deck'); deckCtx = { id, cards:[], q:'' };
  paint(`<header class="top"><button class="ib" data-a="home">${ic('arrow-right')}</button><h2>${esc(deck.name)}</h2>
  <button class="ib" data-a="exportDeck">${ic('copy')}</button></header>
  <div class="row gap"><input id="search" placeholder="بحث..."><button class="btn pri" style="flex:0 0 auto" data-a="editCard" data-id="">${ic('plus')} إضافة</button></div>
  <div class="list" id="clist"><div class="sk"></div><div class="sk"></div></div>`);
  $('#search').addEventListener('input', e => { deckCtx.q = e.target.value; renderCardList(); });
  try { deckCtx.cards = await getDeckCards(id); renderCardList(); } catch (e) { toast(errText(e)); }
}
function editCardModal(cid){
  const c = deckCtx.cards.find(x => x.id === cid);
  openModal(`<h3>${c ? 'تعديل البطاقة' : 'بطاقة جديدة'}</h3><textarea id="ef" rows="3" maxlength="2000" placeholder="الوجه">${esc(c ? c.front : '')}</textarea>
  <textarea id="eb" rows="4" maxlength="4000" placeholder="الظهر">${esc(c ? c.back : '')}</textarea>
  <button class="btn pri wide" data-a="saveCard" data-id="${cid || ''}">حفظ</button>`);
}
async function saveCardAction(cid){
  const front = $('#ef').value.trim(), back = $('#eb').value.trim();
  if (!front || !back) return toast('املأ الوجه والظهر');
  try {
    if (cid) {
      await call(() => db.from('cards').update({ front, back }).eq('id', cid));
      Object.assign(deckCtx.cards.find(x => x.id === cid), { front, back });
    } else {
      const row = await call(() => db.from('cards').insert({ deck_id:deckCtx.id, front, back }).select('id,front,back,state,due').single());
      deckCtx.cards.push(row); adjustCounts(deckCtx.id, 1, 1, 0);
    }
    store.set('cards:' + deckCtx.id, deckCtx.cards); closeModal(); renderCardList();
  } catch (e) { toast(errText(e)); }
}
async function deleteCard(cid){
  const i = deckCtx.cards.findIndex(x => x.id === cid), card = deckCtx.cards[i];
  deckCtx.cards.splice(i, 1); renderCardList();
  adjustCounts(deckCtx.id, -1, card.state === 'new' ? -1 : 0, card.state !== 'new' && new Date(card.due) <= new Date() ? -1 : 0);
  store.set('cards:' + deckCtx.id, deckCtx.cards);
  try { await call(() => db.from('cards').delete().eq('id', cid)); }
  catch (e) { deckCtx.cards.splice(i, 0, card); store.set('cards:' + deckCtx.id, deckCtx.cards); markHomeStale(); renderCardList(); toast('فشل الحذف'); }
}

function receiveModal(code = ''){

async function receiveAction(){
  const code = $('#rcode').value.trim().toLowerCase();
  if (code.length < 6) return toast('أدخل الكود');
  try {
    const rows = await call(() => db.rpc('get_share', { p_code:code }));
    if (!rows || !rows.length) return toast('الكود غير صحيح');
    const cards = (rows[0].cards || []).filter(c => c && typeof c.front === 'string' && typeof c.back === 'string')
      .map(c => ({ front:c.front.slice(0, 2000), back:c.back.slice(0, 4000) })).filter(c => c.front && c.back);
    if (!cards.length) return toast('المشاركة فارغة');
    await saveNewDeck(String(rows[0].name).slice(0, 120), cards);
    closeModal(); toast(`تم استيراد ${cards.length} بطاقة`); renderHome(false);
  } catch (e) { toast(errText(e)); }

// ===== خوارزمية SRS محلية (SM-2 محسّن) =====
function schedule(card, r){
  const now = Date.now(), clamp = v => Math.min(3, Math.max(1.3, v));
  let state = card.state, ease = +card.ease, ivl = +card.ivl_days, lapses = +card.lapses, mins;
  if (state === 'new') {
    if (r <= 2) { state = 'learning'; mins = 10; if (r === 2) ease -= 0.15; }
    else if (r === 3) { state = 'learning'; mins = 1440; }
    else { state = 'review'; mins = 4 * 1440; ease += 0.15; }
    ivl = mins / 1440;
  } else if (state === 'review') {
    if (r === 1) { state = 'relearning'; mins = 10; ease -= 0.2; lapses++; ivl = 0.01; }
    else {
      const mult = r === 2 ? 1.2 : (r === 3 ? ease : ease * 1.3);
      if (r === 2) ease -= 0.15; if (r === 4) ease += 0.15;
      ivl = Math.min(365, Math.max(ivl + 1, ivl * mult * (0.95 + Math.random() * 0.1)));
      mins = Math.round(ivl * 1440);
    }
  } else {
    if (r === 1) mins = 1; else if (r === 2) mins = 10;
    else if (r === 3 && ivl < 0.005) mins = 10;
    else { state = 'review'; mins = (r === 4 ? 4 : 1) * 1440; }
    ivl = mins / 1440;
  }
  return { mins, row:{ state, ease:Math.round(clamp(ease) * 100) / 100, ivl_days:Math.round(ivl * 100) / 100,
    reps:+card.reps + 1, lapses, due:new Date(now + mins * 6e4).toISOString(), last_review:new Date(now).toISOString() } };
}
function fmtMins(m){ return m < 60 ? `${m}د` : (m < 1440 ? `${Math.round(m / 60)}س` : `${Math.round(m / 1440)}ي`); }

// ===== الإرسال بالدفعات (Flush) =====
let flushing = false;
async function flush(){
  const ids = Object.keys(S.pending);
  if (!ids.length || flushing) return true;
  flushing = true;
  const rows = ids.map(i => S.pending[i]);
  try {
    await call(() => db.from('cards').upsert(rows), 1);
    ids.forEach((id, k) => { if (S.pending[id] === rows[k]) delete S.pending[id]; });
    store.set('pending', S.pending); return true;
  } catch (e) { return false; }
  finally { flushing = false; }
}

// ===== الدراسة =====
function saveStudy(){ store.set('study:' + S.study.deckId, { queue:S.queue, study:S.study }); }
async function startStudy(id){
  const saved = store.get('study:' + id);
  if (saved && saved.queue.length > saved.study.idx) {
    S.queue = saved.queue; S.study = saved.study; S.study.loading = false; toast('استئناف الجلسة'); return renderStudy();
  }
  try {
    const rows = await call(() => db.rpc('due_batch', { p_deck:id, p_limit:BATCH }));
    if (!rows.length) return toast('لا توجد بطاقات مستحقة الآن');
    const deck = S.decks.find(d => d.id === id);
    S.queue = rows; S.study = { deckId:id, name:deck ? deck.name : '', idx:0, done:0, more:rows.length >= BATCH, loading:false };
    renderStudy();
  } catch (e) { toast(errText(e)); }
}
let flipped = false;
function renderStudy(){
  setView('study');
  paint(`<div class="study"><div class="sh"><button class="ib" data-a="exit">${ic('x')}</button><div class="prog"><i id="pb"></i></div><span id="pc" class="muted"></span></div>
  <div class="stage" data-a="flip" id="stage"><div class="flip" id="flip"><div class="face" id="ff"></div><div class="face back" id="fb"></div></div></div>
  <div class="rates" id="rates"></div></div>`);
  bindSwipe(); showCard();
}
function showCard(){
  const st = S.study, card = S.queue[st.idx];
  if (!card) { if (st.loading) return setTimeout(showCard, 300); return finishStudy(); }
  const fl = $('#flip'); fl.style.transition = 'none'; fl.classList.remove('on'); void fl.offsetWidth; fl.style.transition = '';
  flipped = false;
  $('#ff').textContent = card.front; $('#fb').textContent = card.back;
  $('#rates').innerHTML = '<div class="hint">اضغط على البطاقة لإظهار الإجابة</div>';
  const left = S.queue.length - st.idx;
  $('#pb').style.width = Math.round(st.done / (st.done + left) * 100) + '%';
  $('#pc').textContent = `${st.done + 1}`;
}
function flipCard(){
  if (flipped || S.view !== 'study') return;
  flipped = true; $('#flip').classList.add('on'); haptic('flip');
  const card = S.queue[S.study.idx], cols = ['', 'var(--err)', 'var(--warn)', 'var(--ok)', 'var(--ac)'], names = ['', 'نسيت', 'صعبة', 'جيدة', 'سهلة'];
  $('#rates').innerHTML = [1, 2, 3, 4].map(r => `<button data-a="rate" data-id="${r}" style="background:${cols[r]}">${names[r]}<small>${fmtMins(schedule(card, r).mins)}</small></button>`).join('');
}
function rateCard(r){
  const st = S.study; if (!flipped || !st) return;
  const card = S.queue[st.idx], res = schedule(card, r);
  Object.assign(card, res.row);
  S.pending[card.id] = { id:card.id, deck_id:card.deck_id, front:card.front, back:card.back, state:card.state, ease:card.ease,
    ivl_days:card.ivl_days, reps:card.reps, lapses:card.lapses, due:card.due, last_review:card.last_review };
  store.set('pending', S.pending);
  st.done++; st.idx++;
  if (res.mins <= 10) S.queue.splice(Math.min(S.queue.length, st.idx + (r === 1 ? 2 : 5)), 0, card);
  haptic(r === 1 ? 'error' : (r === 2 ? 'warning' : 'success'));
  saveStudy();
  if (Object.keys(S.pending).length >= FLUSH_AT) flush();
  if (st.more && !st.loading && S.queue.length - st.idx <= 15) prefetchNext();
  showCard();
}
async function prefetchNext(){
  const st = S.study; st.loading = true;
  try {
    await flush();
    const rows = await call(() => db.rpc('due_batch', { p_deck:st.deckId, p_limit:BATCH }));
    const seen = new Set(S.queue.map(c => c.id)), fresh = rows.filter(r => !seen.has(r.id));
    S.queue.push(...fresh); st.more = fresh.length > 0 && rows.length >= BATCH; saveStudy();
  } catch { st.more = false; }
  st.loading = false;
}
function bindSwipe(){
  let x0 = 0; const el = $('#stage');
  el.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive:true });
  el.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - x0;
    if (flipped && Math.abs(dx) > 70) rateCard(dx > 0 ? 3 : 1);
  });
}
async function exitStudy(){
  if (S.study) saveStudy();
  await flush(); markHomeStale(); showHome();
}
async function finishStudy(){
  const st = S.study;
  paint('<div class="done"><div class="sk"></div></div>');
  const ok = await flush();
  const today = new Date().toLocaleDateString('en-CA'), yest = new Date(Date.now() - 864e5).toLocaleDateString('en-CA');
  const sg = store.get('streak', { last:'', n:0 });
  if (sg.last !== today) store.set('streak', { last:today, n:sg.last === yest ? sg.n + 1 : 1 });
  store.del('study:' + st.deckId); markHomeStale(); S.study = null; S.queue = []; setView('home');
  paint(`<div class="done"><h1>🎉 أحسنت!</h1><p>راجعت ${st.done} تقييماً</p>
  ${ok ? '' : '<p class="muted">لم يُرسل التقدم بعد، سيُرسل تلقائياً عند توفر الاتصال</p>'}
  <button class="btn pri" data-a="home">${ic('home')} الرئيسية</button></div>`);
}

// ===== الإعدادات =====
function applyTheme(){
  const t = store.get('theme', 'auto');
  document.documentElement.dataset.theme = t === 'auto' ? (tg.colorScheme || 'light') : t;
}
function renderSettings(){
  setView('settings');
  const u = (tg.initDataUnsafe && tg.initDataUnsafe.user) || {}, uid = S.session ? S.session.user_id : '';
  paint(`<header class="top"><button class="ib" data-a="home">${ic('arrow-right')}</button><h2>الإعدادات</h2><span></span></header>
  <div class="panel row">${u.photo_url ? `<img class="avatar" src="${esc(u.photo_url)}">` : `<div class="avatar"></div>`}
  <div><b style="margin:0">${esc((u.first_name || '') + ' ' + (u.last_name || ''))}</b><div class="muted">${u.username ? '@' + esc(u.username) : ''}</div></div></div>
  <div class="panel"><b>رمز الاسترداد</b><div class="muted" style="direction:ltr;word-break:break-all">${esc(uid)}</div>
  <div class="muted">احتفظ بهذا الرمز لاسترداد حسابك — تواصل مع الدعم في حال فقدانه.</div>
  <button class="btn wide" data-a="copyText" data-id="${esc(uid)}">${ic('copy')} انسخ رمز الاسترداد</button></div>
  <div class="panel"><b>المظهر</b><div class="row gap"><button class="btn" data-a="theme" data-id="auto">تلقائي</button>
  <button class="btn" data-a="theme" data-id="light">فاتح</button><button class="btn" data-a="theme" data-id="dark">داكن</button></div></div>
  <div class="panel"><button class="btn wide" data-a="exportAll">${ic('database')} تصدير بياناتي</button>
  <button class="btn wide" data-a="bot">${ic('bot')} فتح البوت</button></div>`);
}
async function exportAll(){
  try {
    const rows = await call(() => db.from('cards').select('deck_id,front,back').limit(10000));
    const out = S.decks.map(d => ({ name:d.name, cards:rows.filter(r => r.deck_id === d.id).map(r => ({ front:r.front, back:r.back })) }));
    copyText(JSON.stringify(out));
  } catch (e) { toast(errText(e)); }
}

// ===== المشرف (6 نقرات على الشعار) =====
let logoTaps = 0, logoTimer = null;
async function openAdmin(){
  try {
    if (!(await call(() => db.rpc('is_admin')))) return toast('غير مصرّح');
    const stats = await call(() => db.rpc('admin_stats'));
    const cfg = await call(() => db.from('app_config').select('value').eq('key', 'prompt_base').maybeSingle());
    openModal(`<h3>لوحة المشرف</h3><div class="muted" style="direction:ltr">users ${stats.users} · decks ${stats.decks} · cards ${stats.cards} · shares ${stats.shares}</div>
    <textarea id="adminPrompt" rows="8">${esc(cfg ? cfg.value : '')}</textarea><button class="btn pri wide" data-a="savePrompt">حفظ التعليمات</button>`);
  } catch (e) { toast(errText(e)); }
}
async function savePrompt(){
  const value = $('#adminPrompt').value.trim(); if (!value) return;
  try { await call(() => db.from('app_config').upsert({ key:'prompt_base', value })); store.set('prompt', value); closeModal(); toast('تم الحفظ'); }
  catch (e) { toast(errText(e)); }
}

// ===== توزيع الأحداث =====
const actions = {
  study:id => startStudy(id), open:id => openDeck(id), share:id => shareDeck(id), del:id => deleteDeck(id),
  create:renderCreate, receive:() => receiveModal(), settings:renderSettings, home:showHome, exit:exitStudy,
  copyPrompt:() => copyText((store.get('prompt', DEFAULT_PROMPT)) + '\n\nالمصدر:\n'), saveDeck:saveDeckAction,
  editCard:id => editCardModal(id), saveCard:id => saveCardAction(id), delCard:id => deleteCard(id),
  exportDeck:() => copyText(JSON.stringify(deckCtx.cards.map(c => ({ front:c.front, back:c.back })), null, 1)),
  doReceive:receiveAction, copyText:id => copyText(id), exportAll, flip:flipCard, rate:id => rateCard(+id),
  theme:id => { store.set('theme', id); applyTheme(); }, bot:() => tg.openTelegramLink(BOT_LINK), savePrompt,
  tgShare:id => tg.openTelegramLink('https://t.me/share/url?url=' + id + '&text=' + encodeURIComponent('مجموعة بطاقات Pseudo Card')),
  logo:() => { clearTimeout(logoTimer); logoTimer = setTimeout(() => logoTaps = 0, 1500); if (++logoTaps >= 6) { logoTaps = 0; openAdmin(); } }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (el && actions[el.dataset.a]) actions[el.dataset.a](el.dataset.id, el);
});
document.addEventListener('keydown', e => {
  if (S.view !== 'study' || modals) return;
  if (e.code === 'Space') { e.preventDefault(); flipCard(); }
  else if (['1', '2', '3', '4'].includes(e.key)) rateCard(+e.key);
});

// ===== التشغيل =====
function handleStartParam(){
  const p = tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  if (!p) return;
  if (p.startsWith('deck_')) startStudy(p.slice(5));
  else if (/^[0-9a-f]{8}$/i.test(p)) receiveModal(p);
}
async function boot(){
  tg.ready(); tg.expand();
  try { tg.setHeaderColor('secondary_bg_color'); } catch {}
  if (!tg.initData) {
    document.body.innerHTML = '<div class="empty" style="padding:80px 20px"><h2>Pseudo Card</h2><p>افتح التطبيق من داخل تيليجرام</p></div>'; return;
  }
  applyTheme(); S.pending = store.get('pending', {});
  tg.BackButton.onClick(handleBack);
  const cached = store.get('home');
  if (cached) { S.decks = cached.decks; S.counts = cached.counts; renderHome(false); } else renderHome(true);
  try { await ensureSession(); } catch (e) { S.session = store.get('session'); if (!S.session) { toast('تعذّر الاتصال'); return; } }
  showHome(); handleStartParam(); flush();
  setInterval(flush, FLUSH_EVERY);
  document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
  tg.onEvent('viewportChanged', () => { if (Object.keys(S.pending).length) flush(); });
}
boot();
