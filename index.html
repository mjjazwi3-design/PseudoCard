<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pseudo Card</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;600&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<style>
:root{--ac:#2f6fe4;--ok:#16a34a;--warn:#f59e0b;--err:#dc2626;--new:#8b5cf6;--gold:#d4a24c;--navy:#0b1730;--bg:#f6f1e6;--card:#fffdf8;--tx:#0b1730;--mut:#6b7280;--bd:#e6dcc6;--r:14px;--sh:0 4px 18px rgba(11,23,48,.09)}
[data-theme=dark]{--bg:#0a1429;--card:#122044;--tx:#f3ecdc;--mut:#9aa7c2;--bd:#223259;--sh:0 4px 18px rgba(0,0,0,.45)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Inter,sans-serif;padding:env(safe-area-inset-top) 14px calc(20px + env(safe-area-inset-bottom))}
#app{max-width:560px;margin:0 auto}
button,input,textarea,select{font-family:inherit;font-size:15px;color:var(--tx)}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0}.top h2{margin:0;font-size:18px}
.logo{display:flex;align-items:center;gap:8px;font-family:Cinzel,serif;font-size:21px;font-weight:700;user-select:none}
.logo b{color:var(--gold)}
.row{display:flex;align-items:center;gap:8px}.gap>*{flex:1}.hide{display:none!important}
.streak{display:flex;align-items:center;gap:4px;font-weight:700;color:var(--gold)}
.btn{border:1px solid var(--bd);background:var(--card);border-radius:var(--r);padding:11px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .18s}
.btn.pri{background:linear-gradient(135deg,#e2b865,var(--gold));border-color:var(--gold);color:var(--navy)}
.btn.sel{border-color:var(--gold);color:var(--gold);background:rgba(212,162,76,.12)}
.btn.sm{padding:7px 12px}.btn.wide{width:100%;margin-top:10px}.btn.err{color:var(--err)}
.btn:disabled{opacity:.45}.btn:active{transform:scale(.97)}
.ib{border:0;background:transparent;padding:8px;border-radius:10px;cursor:pointer;color:var(--mut);display:inline-flex;transition:all .18s}.ib.err{color:var(--err)}
.list{margin-top:14px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin-top:12px;font-size:13px;color:var(--mut)}
.crumbs button{border:0;background:transparent;color:var(--gold);font-weight:600;cursor:pointer;padding:4px}
.deck{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:10px;overflow:hidden;cursor:pointer;border:1px solid var(--bd)}
.bar{width:6px;align-self:stretch;background:var(--dc)}.fic{color:var(--dc);display:flex}
.dbody{flex:1;padding:12px 0;min-width:0}.dname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:4px}
.b{padding:1px 8px;border-radius:99px;color:#fff;font-weight:600}.b.due{background:var(--warn)}.b.new{background:var(--new)}
.acts{display:flex;align-items:center;padding-inline-end:6px}
.sk{height:78px;border-radius:var(--r);margin-bottom:10px;background:linear-gradient(90deg,var(--bd),var(--card),var(--bd));background-size:200%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200%}}
.empty{text-align:center;color:var(--mut);padding:50px 0}
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px;border:1px solid var(--bd)}
.panel b{display:block;margin-bottom:8px}
textarea,input[type=text],input[type=number],input:not([type]),select{width:100%;border:1px solid var(--bd);background:var(--bg);border-radius:12px;padding:10px;resize:vertical;margin-bottom:6px}
.prompt{white-space:pre-wrap;font-size:13px;color:var(--mut);background:var(--bg);padding:10px;border-radius:12px;margin:0 0 8px;max-height:120px;overflow:auto}
.muted{color:var(--mut);font-size:13px;margin-top:6px;white-space:pre-wrap}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);color:var(--tx);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto;animation:up .18s}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet h3{margin:0 0 10px}
.code{font-family:Inter,monospace;font-size:26px;letter-spacing:3px;text-align:center;direction:ltr;margin:10px 0;font-weight:700;color:var(--gold)}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:99px;z-index:50;font-size:14px;animation:up .18s;max-width:90vw;text-align:center}
.study{display:flex;flex-direction:column;height:calc(100dvh - 30px - env(safe-area-inset-top))}
.sh{display:flex;align-items:center;gap:10px;padding:10px 0}
.prog{flex:1;height:8px;background:var(--bd);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .18s}
.stage{perspective:1000px;flex:1;display:flex;margin:6px 0 12px;min-height:200px;cursor:pointer}
.flip{position:relative;width:100%;transition:transform .4s;transform-style:preserve-3d}.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border-radius:20px;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;font-size:20px;line-height:1.7;white-space:pre-wrap;overflow:auto;border:1px solid var(--bd)}
.face.back{transform:rotateY(180deg);border:2px solid var(--gold)}
.tip{position:absolute;bottom:12px;font-size:12px;color:var(--mut)}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;min-height:62px}
.rates button{border:0;border-radius:var(--r);color:#fff;padding:10px 2px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:14px}
.rates small{font-weight:400;opacity:.9;font-size:11px;min-height:14px}
.ci{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:10px;margin-bottom:8px;box-shadow:var(--sh);border:1px solid var(--bd)}
.ci div{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.done{text-align:center;padding:60px 0}.done h1{font-size:28px;color:var(--gold)}.done .btn{margin:4px}
.avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--bd)}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:8px}.grid6 .btn{padding:8px 0}
.dots{display:flex;gap:8px;margin-bottom:8px}.dots i{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent}.dots i.sel{border-color:var(--tx)}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
input.tg{appearance:none;-webkit-appearance:none;width:46px;height:26px;padding:0;margin:0;border-radius:99px;background:var(--bd);position:relative;transition:.18s;border:0;flex:none;cursor:pointer}
input.tg::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.18s}
input.tg:checked{background:var(--gold)}input.tg:checked::after{inset-inline-start:23px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.srs{display:grid;grid-template-columns:64px 1fr 1fr;gap:8px;align-items:center;margin-bottom:6px}.srs b{margin:0;font-size:14px}.srs input,.srs select{margin:0}
.pick{width:100%;justify-content:space-between;margin-bottom:6px}
.hint{text-align:center;color:var(--mut);font-size:13px;padding:18px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ===== إعدادات (عدّلها) =====
const SUPABASE_URL = 'https://prdlwxmslcbloinpzpnp.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InByZGx3eG1zbGNibG9pbnB6cG5wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzMDExMDYsImV4cCI6MjEwODg3NzEwNn0.ZqKqWQ09ms3r0IBj_8-VL4j5DsmHcV_juljuHaxZJu0';
const APP_LINK = 'http://t.me/Pseudosciencetest_bot/Pseudosciencetest';
const BOT_LINK = 'https://t.me/Pseudosciencetest_bot';

const FRESH_MS = 300000, BATCH = 30, FLUSH_AT = 50, FLUSH_EVERY = 60000, CARDS_CACHE_MAX = 1.5 * 1024 * 1024;
const LIMIT_MSG = 'لقد وصلت للحد الأقصى اليوم. راجع المستحق أو عد غداً';
const COLORS = { blue:'#2f6fe4', green:'#16a34a', violet:'#8b5cf6', amber:'#f59e0b', red:'#dc2626' };
const ICONS = ['folder', 'heart-pulse', 'brain', 'bone', 'baby', 'pill', 'stethoscope', 'microscope', 'syringe', 'flask-conical', 'book-open', 'activity'];
const DEFAULT_SETTINGS = { max_interval:365, new_per_day:20, step_again:1, step_hard:10, step_good:1440, step_easy:5760 };
const DEFAULT_PROMPT = 'أنت مساعد لإنشاء بطاقات مراجعة لطلاب الطب. اكتب البطاقات فقط داخل كتلة كود واحدة، بدون مقدمة أو شرح أو ترقيم. كل بطاقة في سطر واحد بهذه الصيغة بالضبط: الوجه :: الظهر. كل بطاقة تختبر فكرة واحدة قصيرة ودقيقة، ولا تضف معلومة غير موجودة في المصدر. اللغة: نفس لغة المصدر مع إبقاء المصطلحات الطبية بالإنجليزية.';
const LOGO_SVG = '<svg viewBox="0 0 40 40" width="34" height="34"><rect x="4" y="9" width="17" height="24" rx="4" fill="#122044" stroke="#d4a24c" transform="rotate(-18 12 21)"/><rect x="9" y="7" width="17" height="24" rx="4" fill="#0f1b3a" stroke="#d4a24c" transform="rotate(-8 17 19)"/><rect x="14" y="6" width="19" height="27" rx="4" fill="#f6efdc" stroke="#d4a24c"/><path d="M23.5 12c3 3 5 5 5 7.5a2.6 2.6 0 0 1-4.3 2l.6 3.5h-2.6l.6-3.5a2.6 2.6 0 0 1-4.3-2c0-2.5 2-4.5 5-7.5z" fill="#0b1730"/></svg>';

// ===== الحالة المركزية =====
const S = { session:null, decks:[], folders:[], counts:{}, settings:null, cwd:null, queue:[], pending:{}, view:'home', study:null, newToday:{ day:'', n:0 } };
const tg = window.Telegram.WebApp;
const authClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY,
  { auth:{ persistSession:false, autoRefreshToken:false, detectSessionInUrl:false } });
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY,
  { accessToken: async () => S.session && S.session.access_token });

// ===== أدوات =====
const $ = s => document.querySelector(s);
const ic = n => `<i data-lucide="${n}"></i>`;
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clip = (t, n) => String(t == null ? '' : t).trim().slice(0, n);
const wait = ms => new Promise(r => setTimeout(r, ms));
const uuid = () => crypto.randomUUID();
const store = {
  get(k, d = null){ try { const v = localStorage.getItem('pc:' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){
    const j = JSON.stringify(v);
    try { localStorage.setItem('pc:' + k, j); return true; }
    catch { dropCardCaches(); try { localStorage.setItem('pc:' + k, j); return true; } catch { return false; } }
  },
  del(k){ try { localStorage.removeItem('pc:' + k); } catch {} }
};
// كاش البطاقات: localStorage إن كان الحجم <= 1.5MB وإلا الذاكرة فقط (حد المتصفح 5MB)
const memCards = new Map();
function dropCardCaches(){ Object.keys(localStorage).filter(k => k.startsWith('pc:cards:')).forEach(k => localStorage.removeItem(k)); }
function cacheCards(id, rows){
  memCards.set(id, rows);
  if (JSON.stringify(rows).length * 2 > CARDS_CACHE_MAX) store.del('cards:' + id); else store.set('cards:' + id, rows);
}
function dropCards(id){ memCards.delete(id); store.del('cards:' + id); }
const localDay = () => new Date().toLocaleDateString('en-CA');
function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), Math.max(2600, msg.length * 70));
}
function haptic(kind){
  try { kind === 'flip' ? tg.HapticFeedback.impactOccurred('light') : tg.HapticFeedback.notificationOccurred(kind); } catch {}
}
function errText(e){
  const m = ((e && e.message) || '') + ' ' + ((e && e.code) || '') + ' ' + ((e && e.status) || '');
  if (/rate limited|over_request_rate|429/i.test(m)) return 'طلبات كثيرة، انتظر دقيقة ثم أعد المحاولة';
  if (/Failed to fetch|Failed to send a request|NetworkError|network|timeout|AuthRetryableFetch|Load failed/i.test(m)) return 'لا يوجد اتصال بالإنترنت';
  if (/too large|invalid size|413|payload/i.test(m)) return 'الحجم كبير (الحد: 1000 بطاقة للمجموعة، 200 مجموعة للمجلد، 5MB)';
  if (/row-level security|42501|not admin|JWT|permission|\b40[13]\b/i.test(m)) return 'لا تملك صلاحية لهذا الإجراء';
  if (/check constraint|23514|bad name|bad cards|bad data/i.test(m)) return 'بيانات غير صالحة (تحقق من الأطوال)';
  if (/23503|foreign key|not found/i.test(m)) return 'العنصر غير موجود، ربما حُذف';
  if (/auth required|invalid signature/i.test(m)) return 'تعذّر التحقق من حسابك، أعد فتح التطبيق من تيليجرام';
  return 'حدث خطأ غير متوقع، حاول مجدداً';
}
async function copyText(text){
  try { await navigator.clipboard.writeText(text); }
  catch { const a = document.createElement('textarea'); a.value = text; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); }
  toast('تم النسخ');
}
function paint(html){ $('#app').innerHTML = html; lucide.createIcons(); window.scrollTo(0, 0); }

// ===== الجلسة (Telegram Auth عبر Edge Function) =====
function saveSession(x){
  const old = store.get('session');
  if (old && old.user_id !== x.user.id) Object.keys(localStorage).filter(k => k.startsWith('pc:') && k !== 'pc:theme').forEach(k => localStorage.removeItem(k));
  S.session = { access_token:x.access_token, refresh_token:x.refresh_token, expires_at:x.expires_at, user_id:x.user.id };
  store.set('session', S.session);
}
function isDefinitiveAuthError(e){
  const status = e && e.status;
  return !!status && status >= 400 && status < 500 && status !== 429 && status !== 408;
}
async function refreshWithRetry(refreshToken){
  for (let i = 0; i < 3; i++) {
    const r = await authClient.auth.refreshSession({ refresh_token:refreshToken });
    if (!r.error && r.data.session) return r.data.session;
    if (isDefinitiveAuthError(r.error)) return null;
    await wait(700 * (i + 1));
  }
  throw new Error('Failed to fetch');
}
// دخول عبر Edge Function: توقيع تيليجرام مرفوض (4xx) = نهائي، وغير ذلك يُعاد 3 مرات
async function telegramLogin(){
  for (let i = 0; i < 3; i++) {
    const r = await authClient.functions.invoke('telegram-auth', { body:{ initData:tg.initData }, headers:{ Authorization:'Bearer ' + SUPABASE_ANON_KEY } });
    const s = r.data && r.data.session;
    if (!r.error && s && s.access_token) return s;
    const st = r.error && r.error.context && r.error.context.status;
    if (st && st >= 400 && st < 500 && st !== 429 && st !== 408) throw new Error('auth required');
    await wait(700 * (i + 1));
  }
  throw new Error('Failed to fetch');
}
async function doEnsureSession(){
  const s = S.session || store.get('session');
  if (s && s.expires_at > Date.now() / 1000 + 300) { S.session = s; return; }
  if (s) { const fresh = await refreshWithRetry(s.refresh_token); if (fresh) return saveSession(fresh); }
  saveSession(await telegramLogin());
}
let sessionLock = null;
function ensureSession(){
  if (!sessionLock) sessionLock = doEnsureSession().finally(() => { sessionLock = null; });
  return sessionLock;
}
async function call(fn, retries = 0){
  for (let i = 0; i <= retries; i++) {
    try { await ensureSession(); const r = await fn(); if (r.error) throw r.error; return r.data; }
    catch (e) { if (i === retries) throw e; await wait(800); }
  }
}

// ===== مودال وزر الرجوع =====
let modals = 0;
function syncBack(){ try { (modals > 0 || S.view !== 'home' || S.cwd) ? tg.BackButton.show() : tg.BackButton.hide(); } catch {} }
function setView(v){ S.view = v; syncBack(); }
function openModal(html){
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="sheet">${html}</div>`;
  m.addEventListener('click', e => { if (e.target === m) closeModal(); });
  document.body.appendChild(m); modals++; lucide.createIcons(); syncBack();
}
function closeModal(){
  const all = document.querySelectorAll('.modal');
  if (all.length) { all[all.length - 1].remove(); modals--; syncBack(); }
}
function handleBack(){
  if (modals > 0) closeModal();
  else if (S.view === 'study') exitStudy();
  else if (S.view === 'home' && S.cwd) changeFolder((S.folders.find(f => f.id === S.cwd) || {}).parent_id || null);
  else showHome();
}

// ===== الكاش والعدادات =====
function saveHome(t = Date.now()){ store.set('home', { t, decks:S.decks, folders:S.folders, counts:S.counts, settings:S.settings, nt:S.newToday }); }
function loadCached(c){ S.decks = c.decks; S.folders = c.folders || []; S.counts = c.counts; S.settings = c.settings || null; S.newToday = c.nt || { day:'', n:0 }; }
function saveHomeKeep(){ const h = store.get('home'); saveHome(h ? h.t : Date.now()); }
function adjustCounts(id, total, isNew, isDue, persist = true){
  const c = S.counts[id] || (S.counts[id] = { total:0, due:0, new:0 });
  c.total = Math.max(0, c.total + total); c.new = Math.max(0, c.new + isNew); c.due = Math.max(0, c.due + isDue);
  if (persist) saveHomeKeep();
}
function streakValue(){
  const s = store.get('streak'); if (!s) return 0;
  const today = new Date().toLocaleDateString('en-CA'), yest = new Date(Date.now() - 864e5).toLocaleDateString('en-CA');
  return (s.last === today || s.last === yest) ? s.n : 0;
}
const settingsNow = () => Object.assign({}, DEFAULT_SETTINGS, S.settings || {});
const newUsed = () => (S.newToday.day === localDay() ? S.newToday.n : 0);
const newLeft = () => Math.max(0, settingsNow().new_per_day - newUsed());
function limitHit(id){ const c = S.counts[id]; return !!c && c.new > 0 && newLeft() === 0; }

// ===== الشاشة الرئيسية (شجرة مجلدات) =====
function subtreeIds(id){
  const ids = [id];
  S.folders.filter(f => f.parent_id === id).forEach(f => ids.push(...subtreeIds(f.id)));
  return ids;
}
function folderStats(id){
  const set = new Set(subtreeIds(id)), t = { decks:0, due:0, new:0 };
  S.decks.forEach(d => { if (set.has(d.folder_id)) { const c = S.counts[d.id] || {}; t.decks++; t.due += c.due || 0; t.new += c.new || 0; } });
  return t;
}
function crumbsHtml(){
  const chain = []; let f = S.folders.find(x => x.id === S.cwd);
  while (f) { chain.unshift(f); f = S.folders.find(x => x.id === f.parent_id); }
  if (!chain.length) return '';
  return `<div class="crumbs"><button data-a="cd" data-id="">الرئيسية</button>` +
    chain.map(c => ` › <button data-a="cd" data-id="${c.id}">${esc(c.name)}</button>`).join('') + '</div>';
}
function folderHtml(f){
  const st = folderStats(f.id);
  return `<div class="deck" style="--dc:${COLORS[f.color] || COLORS.blue}" data-a="cd" data-id="${f.id}"><div class="bar"></div>
  <div class="fic">${ic(ICONS.includes(f.icon) ? f.icon : 'folder')}</div>
  <div class="dbody"><div class="dname">${esc(f.name)}</div><div class="meta"><span>${st.decks} مجموعة</span>
  ${st.due ? `<span class="b due">${st.due} مستحقة</span>` : ''}${st.new ? `<span class="b new">${st.new} جديدة</span>` : ''}</div></div>
  <div class="acts"><button class="ib" data-a="editFolder" data-id="${f.id}">${ic('pencil')}</button></div></div>`;
}
function deckHtml(d){

function parseCards(text){
  return text.split('\n')
    .map(l => l.replace(/^\s*(```.*|[-*•]\s+|\d+[.)]\s+)/, '').trim())
    .filter(l => l.includes('::'))
    .map(l => { const i = l.indexOf('::'); return { front:l.slice(0, i).trim().slice(0, 2000), back:l.slice(i + 2).trim().slice(0, 4000) }; })
    .filter(c => c.front && c.back);
}

async function insertCardRows(rows, rollback = false){
  const done = [];
  try {
    for (let i = 0; i < rows.length; i += 500) {
      const part = rows.slice(i, i + 500);
      await call(() => db.from('cards').insert(part)); done.push(...part.map(r => r.id));
    }
  } catch (e) {
    if (rollback) for (let i = 0; i < done.length; i += 100) { try { await db.from('cards').delete().in('id', done.slice(i, i + 100)); } catch {} }
    throw e;
  }
}
async function saveNewDeck(name, cards, folderId){
  const color = Object.keys(COLORS)[S.decks.length % 5];
  const deck = await call(() => db.from('decks').insert({ id:uuid(), name, color, folder_id:folderId || null })
    .select('id,name,color,folder_id,srs_enabled,created_at').single());
  try { await insertCardRows(cards.map(c => ({ id:uuid(), deck_id:deck.id, front:c.front, back:c.back }))); }
  catch (e) { try { await db.from('decks').delete().eq('id', deck.id); } catch {} throw e; }
  S.decks.unshift(deck); S.counts[deck.id] = { total:cards.length, due:0, new:cards.length }; saveHomeKeep();
  return deck;
}
async function addToDeck(deckId, cards){
  await insertCardRows(cards.map(c => ({ id:uuid(), deck_id:deckId, front:c.front, back:c.back })), true);
  adjustCounts(deckId, cards.length, cards.length, 0); dropCards(deckId);
}

}

async function getDeckCards(id){
  const cached = memCards.get(id) || store.get('cards:' + id); if (cached) { memCards.set(id, cached); return cached; }
  const rows = [];

    const part = await call(() => db.from('cards').select('id,front,back,state,due').eq('deck_id', id).order('created_at').order('id').range(i, i + 999));
    rows.push(...part); if (part.length < 1000) break;
  }

    .map(c => ({ front:clip(c.front, 2000), back:clip(c.back, 4000) })).filter(c => c.front && c.back);

async function importFolderShare(data){
  const fl = (data.folders || []).slice(0, 200), dk = (data.decks || []).slice(0, 200);
  if (!fl.length || !dk.length) throw new Error('bad data');
  const ids = fl.map(() => uuid()), depth = [];

// ===== خوارزمية SRS محلية (قابلة للضبط) =====
const UNITS = [{ m:1, t:'دقيقة' }, { m:60, t:'ساعة' }, { m:1440, t:'يوم' }];
function splitMins(m){ return m % 1440 === 0 ? { n:m / 1440, u:1440 } : (m % 60 === 0 ? { n:m / 60, u:60 } : { n:m, u:1 }); }
function srsConfig(){
  const s = settingsNow(), D = DEFAULT_SETTINGS, pick = k => (+s[k] >= 1 ? Math.round(+s[k]) : D[k]);
  return { again:pick('step_again'), hard:pick('step_hard'), good:pick('step_good'), easy:pick('step_easy'), maxIvl:Math.max(1, +s.max_interval || 365) };
}
// جديدة/تعلّم/إعادة تعلّم: الفواصل من الإعدادات (نسيت/صعبة/جيدة/سهلة)
function stepLearning(card, r, cfg){
  const isNew = card.state === 'new', isRe = card.state === 'relearning', base = Math.max(1, +card.ivl_days || 1);
  const out = { state:isNew ? 'learning' : card.state, step:0, ease:+card.ease, ivl:+card.ivl_days, lapses:+card.lapses, mins:cfg.again };
  if (r === 1) return out;
  if (r === 2) { if (isNew) out.ease -= 0.15; out.step = +card.step || 0; out.mins = cfg.hard; return out; }
  const pass = (mins, days, bonus) => Object.assign(out, { state:'review', step:0, ease:out.ease + bonus, ivl:days, mins });
  if (r === 3) {
    if (!isRe && cfg.good < 1440 && !(+card.step > 0)) { out.step = 1; out.mins = cfg.good; return out; }
    return isRe ? pass(base * 1440, base, 0) : pass(Math.max(cfg.good, 1440), Math.max(1, cfg.good / 1440), 0);
  }
  if (isRe) { const d = Math.ceil(base * 1.3); return pass(d * 1440, d, 0); }
  return pass(Math.max(cfg.easy, 1440), Math.max(1, cfg.easy / 1440), isNew ? 0.15 : 0);
}
// تشويش ثابت لكل بطاقة (المعاينة على الزر = الفاصل الفعلي)
function fuzz(card){ const h = parseInt(String(card.id).slice(-4), 16) || 0; return 0.95 + ((h + (+card.reps || 0) * 7919) % 1000) / 10000; }
function stepReview(card, r, cfg){
  let ease = +card.ease, ivl = +card.ivl_days;
  if (r === 1) return { state:'relearning', step:0, ease:ease - 0.2, ivl:Math.max(1, Math.round(ivl * 0.5)), lapses:+card.lapses + 1, mins:cfg.again };
  const mult = r === 2 ? 1.2 : (r === 3 ? ease : ease * 1.3);
  if (r === 2) ease -= 0.15;
  if (r === 4) ease += 0.15;
  ivl = Math.min(cfg.maxIvl, Math.max(Math.min(ivl + 1, cfg.maxIvl), ivl * mult * fuzz(card)));
  return { state:'review', step:0, ease, ivl, lapses:+card.lapses, mins:Math.round(ivl * 1440) };
}
function schedule(card, r, srs = true){
  const now = Date.now(), stamp = new Date(now).toISOString();
  if (!srs) return { mins:0, again:r === 1, row:{ reps:+card.reps + 1, last_review:stamp } };
  const cfg = srsConfig(), o = card.state === 'review' ? stepReview(card, r, cfg) : stepLearning(card, r, cfg);
  const row = { state:o.state, step:o.step, ease:Math.round(Math.min(3, Math.max(1.3, o.ease)) * 100) / 100,
    ivl_days:Math.round(o.ivl * 100) / 100, reps:+card.reps + 1, lapses:o.lapses,
    due:new Date(now + o.mins * 6e4).toISOString(), last_review:stamp };
  if (card.state === 'new') row.first_seen = stamp;
  return { mins:o.mins, again:o.mins <= 10, row };
}
function fmtMins(m){ return m < 60 ? `${m}د` : (m < 1440 ? `${Math.round(m / 60)}س` : `${Math.round(m / 1440)}ي`); }

// ===== الإرسال بالدفعات (Flush) =====
let flushing = false;
const newCnt = () => store.get('newcnt', {});
const unsentNew = () => newCnt()[localDay()] || 0;
// تسجيل بطاقة جديدة قُيّمت: محلياً فوراً، وتُرسل للعدّاد دفعة واحدة مع الـ Flush
function countNew(){
  const day = localDay(), m = newCnt(); m[day] = (m[day] || 0) + 1; store.set('newcnt', m);
  S.newToday = { day, n:newUsed() + 1 };
}
async function flushNewCounter(){
  const m = newCnt();
  for (const day of Object.keys(m)) {
    const n = m[day]; if (!(n > 0)) continue;
    await call(() => db.rpc('increment_new_counter', { p_day:day, p_by:n }), 1);
    const cur = newCnt(); cur[day] = (cur[day] || 0) - n;
    if (cur[day] <= 0) delete cur[day];
    Object.keys(cur).length ? store.set('newcnt', cur) : store.del('newcnt');
  }
}
async function flush(){
  const ids = Object.keys(S.pending);
  if ((!ids.length && !Object.keys(newCnt()).length) || flushing) return true;
  flushing = true;
  try {
    if (ids.length) {
      const rows = ids.map(i => S.pending[i]);
      await call(() => db.from('cards').upsert(rows), 1);
      ids.forEach((id, k) => { if (S.pending[id] === rows[k]) delete S.pending[id]; });
      store.set('pending', S.pending);
    }
    await flushNewCounter();
    return true;
  } catch (e) { return false; }
  finally { flushing = false; }
}

let flipped = false;

async function fetchBatch(deckId, srs, exclude){
  if (srs) return call(() => db.rpc('due_batch', { p_deck:deckId, p_limit:BATCH, p_new_limit:Math.max(0, settingsNow().new_per_day - unsentNew()), p_day:localDay(), p_exclude:exclude }));
  return call(() => db.rpc('cram_batch', { p_deck:deckId, p_limit:BATCH, p_exclude:exclude }));
}
async function startStudy(id, fresh = false){
  const saved = fresh ? null : store.get('study:' + id);
  if (saved && saved.queue.length > saved.study.idx) {
    S.queue = saved.queue; S.study = saved.study; S.study.loading = false; toast('استئناف الجلسة'); return renderStudy();
  }
  const deck = S.decks.find(d => d.id === id), srs = !deck || deck.srs_enabled !== false;
  try {
    await flush();
    const rows = await fetchBatch(id, srs, []);
    if (!rows.length) return toast(srs && limitHit(id) ? LIMIT_MSG : 'انتهيت من المستحق والجديد لليوم 🎉');
    S.queue = rows; S.study = { deckId:id, srs, idx:0, done:0, more:rows.length >= BATCH, loading:false };

}
function renderStudy(){

function showCard(tries = 0){
  const st = S.study, card = S.queue[st.idx];
  if (!card) {
    if (st.loading && tries < 15) return setTimeout(() => showCard(tries + 1), 300);
    if (st.loading) { st.loading = false; toast('تعذّر تحميل المزيد'); }
    return finishStudy();
  }
  const fl = $('#flip'); fl.style.transition = 'none'; fl.classList.remove('on'); void fl.offsetWidth; fl.style.transition = '';
  flipped = false; $('#ft').textContent = card.front; $('#bt').textContent = card.back; renderRates();

function renderRates(){
  const box = $('#rates');
  if (!flipped) { box.innerHTML = ''; return; }
  const card = S.queue[S.study.idx], cols = ['', 'var(--err)', 'var(--warn)', 'var(--ok)', 'var(--ac)'], names = ['', 'نسيت', 'صعبة', 'جيدة', 'سهلة'];

}
function flipCard(){
  if (S.view !== 'study' || !S.study || !S.queue[S.study.idx]) return;
  flipped = !flipped; $('#flip').classList.toggle('on', flipped); haptic('flip'); renderRates();
}
function trackCounts(st, prev, card){
  if (!st.srs) return;
  const now = Date.now();
  const dNew = prev.state === 'new' && card.state !== 'new' ? -1 : 0;
  const dDue = prev.state !== 'new' && new Date(prev.due) <= now && new Date(card.due) > now ? -1 : 0;
  if (dNew || dDue) adjustCounts(card.deck_id, 0, dNew, dDue, false);
}
function rateCard(r){
  const st = S.study; if (!st || !flipped) return;
  const card = S.queue[st.idx], prev = { state:card.state, due:card.due }, res = schedule(card, r, st.srs);
  Object.assign(card, res.row);
  S.pending[card.id] = { id:card.id, deck_id:card.deck_id, front:card.front, back:card.back, state:card.state, step:card.step || 0,
    ease:card.ease, ivl_days:card.ivl_days, reps:card.reps, lapses:card.lapses, due:card.due, last_review:card.last_review, first_seen:card.first_seen || null };
  store.set('pending', S.pending); trackCounts(st, prev, card);
  if (st.srs && prev.state === 'new') countNew();
  st.done++; st.idx++;
  if (res.again) S.queue.splice(Math.min(S.queue.length, st.idx + (r === 1 ? 2 : 5)), 0, card);
  haptic(r === 1 ? 'error' : (r === 2 ? 'warning' : 'success')); saveStudy();
  if (Object.keys(S.pending).length >= FLUSH_AT) flush();
  if (st.more && !st.loading && S.queue.length - st.idx <= 15) prefetchNext();
  showCard();
}
async function prefetchNext(){
  const st = S.study; st.loading = true;
  try {
    await flush();
    const rows = await fetchBatch(st.deckId, st.srs, [...new Set(S.queue.map(c => c.id))]);
    S.queue.push(...rows); st.more = rows.length >= BATCH; saveStudy();
  } catch { st.more = false; }
  st.loading = false;
}
function bindSwipe(){

  el.addEventListener('touchend', e => {

    if (flipped && Math.abs(dx) > 70) rateCard(dx > 0 ? 4 : 1);

}

  mode:id => setMode(id), copyPrompt:() => copyText(store.get('prompt', DEFAULT_PROMPT) + '\n\nالمصدر:\n'), saveCreate:saveCreateAction,
  editCard:id => editCardModal(id), saveCard:id => saveCardAction(id), delCard:id => deleteCard(id),
  doReceive:receiveAction, copyText:id => copyText(id), exportAll, flip:flipCard, rate:id => rateCard(+id), saveSrs:saveSrsAction,
  theme:id => { store.set('theme', id); applyTheme(); markTheme(); }, bot:() => tg.openTelegramLink(BOT_LINK), savePrompt, logo:logoTap,
  tgShare:id => tg.openTelegramLink('https://t.me/share/url?url=' + id + '&text=' + encodeURIComponent('Pseudo Card'))
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (el && actions[el.dataset.a]) actions[el.dataset.a](el.dataset.id, el);
});
document.addEventListener('keydown', e => {
  if (S.view !== 'study' || modals) return;
  if (e.code === 'Space') { e.preventDefault(); flipCard(); }
  else if (['1', '2', '3', '4'].includes(e.key)) rateCard(+e.key);
});

// ===== التشغيل =====
function handleStartParam(){
  const p = tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  if (!p) return;
  if (p.startsWith('deck_')) startStudy(p.slice(5));
  else if (/^[0-9a-f]{8}$/i.test(p)) receiveModal(p);
}
function flushIfPending(){ if (Object.keys(S.pending).length || Object.keys(newCnt()).length) flush(); }
async function boot(){
  tg.ready(); tg.expand();
  try { tg.setHeaderColor('secondary_bg_color'); } catch {}
  if (!tg.initData) {
    document.body.innerHTML = '<div class="empty" style="padding:80px 20px"><h2>Pseudo Card</h2><p>افتح التطبيق من داخل تيليجرام</p></div>'; return;
  }
  applyTheme(); S.pending = store.get('pending', {});
  tg.BackButton.onClick(handleBack);
  const cached = store.get('home');
  if (cached) { loadCached(cached); renderHome(false); }
  else renderHome(true);
  try { await ensureSession(); }
  catch (e) { S.session = store.get('session'); if (!S.session) { toast(errText(e)); return; } }
  await showHome(); handleStartParam(); flushIfPending();
  setInterval(flushIfPending, FLUSH_EVERY);
  document.addEventListener('visibilitychange', () => { if (document.hidden) flushIfPending(); });
  window.addEventListener('pagehide', flushIfPending);
}
boot();
</script>
</body>
</html>
