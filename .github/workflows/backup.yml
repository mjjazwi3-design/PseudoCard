name: Supabase Backup
on:
  schedule:
    - cron: "0 2 * * *" # يعمل يومياً الساعة 2 صباحاً
  workflow_dispatch: # يسمح لك بتشغيله يدوياً

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dump database using Docker (PostgreSQL 17)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            postgres:17 \
            pg_dump "${{ secrets.SUPABASE_DB_URL }}" -f backup.sql

      - name: Commit and push backup
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated database backup"
          file_pattern: backup.sql
