name: Supabase Backup
on:
  schedule:
    - cron: "0 2 * * *" # يعمل يومياً الساعة 2 صباحاً
  workflow_dispatch: # يسمح لك بتشغيله يدوياً للتجربة
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install PostgreSQL 17 Client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> $GITHUB_PATH
          
      - name: Verify pg_dump version
        run: pg_dump --version
          
      - name: Dump database
        run: |
          pg_dump "${{ secrets.SUPABASE_DB_URL }}" -f backup.sql
          
      - name: Commit and push backup
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated database backup"
          file_pattern: backup.sql
